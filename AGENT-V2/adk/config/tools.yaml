# ---------------------------------------------------------------------------
# Tool Definitions
#
# Tools defined here are made available to agents via their `tools` list in
# agents.yaml. Tools from the registry are also merged at runtime, so you only
# need to define your own custom tools here.
#
# Supported tool_type values:
#   mcp  - Model Context Protocol toolset (auto-created from config)
#
# Sample MCP tool attributes (from the file's own commented reference):
#   name / description / tool_type / mcp_server_url ("${VAR}" substitution)
#   mcp_tool_names: []      # [] = auto-discover all tools from the server
#   tool_name_prefix: ""    # prefix to avoid collisions across MCP servers
#   tags: []
# ---------------------------------------------------------------------------
# THIS FILE IS THE LOCAL RUNTIME'S ONLY SOURCE FOR THE MCP TOOLSET.
#
# Local `adk` runs read the toolset from here. Higher environments do NOT read
# this file at all — there the toolset is the `ecm_dcm_oracle_mcp` entry created
# in the Ask Banking onboarding UI, and promotion means copying the agent
# description/instructions into that UI by hand.
#
# So the two paths are independent, and emptying this list does not "defer to
# the registry" — it removes the tools from local only, and the agent fails with
# `Tool 'discover_business_terms' not found. Available tools: transfer_to_agent,
# list_skills, load_skill, load_skill_resource, run_skill_script`.
#
# `name` must match what agents.yaml and skills.yaml reference, and it matches
# the registry entry name so local and QA behave the same.
# ---------------------------------------------------------------------------
# WHY THE DESCRIPTION IS LONGER THAN A LABEL:
# Tool definitions ship with EVERY request, regardless of which skills loaded,
# how long the conversation has run, or whether the model re-read the catalog.
# That makes it the most reliable place to put a rule — so it carries exactly
# the four whose absence produces a WRONG answer rather than a failed one.
# Everything else belongs in the skill or the catalog. Keep this text and the
# registry entry's Description field in sync.
# ---------------------------------------------------------------------------

tools:
  - name: ecm_dcm_oracle_mcp                   # referenced by capital_markets_agent_v2 (agents.yaml) and both skills
    description: >
      Ontology-based text-to-SQL MCP server for ECM/DCM. Exposes governed,
      read-only tools: `discover_business_terms(source=...)` and
      `run_bqs_query` (runs a structured Business Query Specification against
      ONE object; you never write raw SQL).
      DISCOVERY IS SCOPED: there are FOUR grain-aligned objects — `ecm_dcm_deal`
      (one row per deal), `ecm_dcm_tranche` (per tranche: syndicate, B&D,
      identifiers, coupon), `ecm_dcm_order` (per order: investors, demand,
      allocation), `ecm_dcm_entity` (name → id). Choose by grain, then pass that
      name as `source` so you get ONE catalog. Omitting `source` returns all
      four — four times the context for one answer.
      RULES THAT ALWAYS APPLY: (1) Pick the object by the grain of the thing
      being counted/listed — the object must be fine enough to carry every field
      you filter or project; among those, pick the coarsest. (2) ALWAYS set a
      `product` filter ('ECM' or 'DCM') — it is also the entitlement scope.
      (3) NEVER total sizes, allocations or demand across both products: ECM is
      SHARE COUNTS, DCM is notional MONEY, and DCM money needs one currency.
      (4) Ids (deal, tranche, order, GP id, GFCID) are TEXT — quote them, keep
      leading zeros, and never invent one that no tool response returned.
    tool_type: mcp                             # Currently only "mcp" is supported.
    # app/mcpserver.py serves on port 8080; point this at the V2 server, not the
    # v1 nl2sql one. See app/.env.example for the variable's current default.
    #
    # LOCAL RUNS MUST CARRY THE SOEID IN THIS URL.
    # Observed 2026-08-09 from the server's own access log: calls from the
    # deployed platform (10.18.16.x) arrive WITH an `x-user-id` header; calls
    # from local ADK (127.0.0.1) arrive with NO identity header at all. The
    # server no longer invents one — `_resolve_soeid()` reads the request only,
    # and `run_bqs_query` refuses with `missing_soeid` — so a local run without
    # a SOEID gets no data. Put YOUR soeid in YOUR .env, not in this file:
    #
    #     TEXT_TO_SQL_MCP_URL=http://localhost:8080/mcp?user_id=<your-soeid>
    #
    # `_resolve_user_id` checks headers FIRST and only then `?user_id=`, so this
    # goes inert the moment a real header arrives. v1 needed none of this only
    # because it had a server-side default quietly answering as somebody else.
    #
    # LOCAL RUNS ALSO NEED AN ENTITLEMENT DECISION.
    # The gate no longer has a local bypass — RUN_MODE is not consulted, so the
    # entitlement path behaves the same on a laptop as it does in QA (which is
    # the point: an entitlement bug you cannot reproduce locally is one you
    # debug in QA). ECM_DCM_ENTITLEMENT_FEATURE_FLAG defaults to "true", so
    # without ECMO API credentials every local query is refused with
    # `entitlement_misconfigured`. Pick one, in YOUR .env:
    #
    #     ECM_DCM_ENTITLEMENT_FEATURE_FLAG=false     # no gate; grants ECM+DCM
    #   or
    #     ECM_DCM_PRODUCT_ENTITLEMENT_URL=...        # real gate against ECMO
    #     ECM_DCM_ENTITLEMENT_POLICY_ID=...
    #
    # Either way the server says which one it took, at startup, on one line
    # beginning `ENTITLEMENT CONFIG:`.
    mcp_server_url: "${TEXT_TO_SQL_MCP_URL}"
    # Pinned rather than auto-discovered: a governed read-only surface should not
    # silently grow when a new tool is added to the server.
    mcp_tool_names:
      - discover_business_terms
      - run_bqs_query
    tags:
      - "mcp"
      - "text-to-sql"
      - "ontology"
