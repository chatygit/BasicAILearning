# ---------------------------------------------------------------------------
# Governed ontology — ECM/DCM TRANCHE object (Oracle via Starburst/Trino).
#
# Grain: ONE row per PRODUCT + DEAL_ID + TRANCHE_ID. The rewritten view HOLDS
# this grain (ECM 33,010 rows = 33,010 tranches; DCM 36,370 = 36,370) — never
# deduplicate, and never "fix" a line that says so.
#
# Tranche facts live here: sizing, pricing, currency, coupon/tenor/seniority/
# rating/maturity (DCM), product type and exchange (ECM), identifiers,
# syndicate and bill-and-deliver. Order/investor attributes are NOT here — use
# capital_markets_order.
#
# Physical source: DGSTREAM.VW_TRANCHE_SUMMARY (UNION ALL ECM + DCM) via the
# Starburst catalog dataglobe_oraas.dgstream.
#
# ROUTING NOTE: this is the ONLY object that can answer syndicate, B&D,
# identifier, coupon, tenor, rating, maturity and exchange questions. "Which
# deals did Citi bill?" is a TRANCHE question even though the user says
# "deals" — the grain is tranches; report distinct deals with deal_count.
#
# NO HOP NEEDED. These DEAL attributes are physically on this view and are
# modelled below: deal_name, issuer_name, issuer_id, ticker, sector,
# deal_status, deal_region, use_of_proceeds, settlement_currency. A tranche ask
# that ALSO scopes a status, a region, a purpose, a sector or an issuer is ONE
# request here. Do not route to capital_markets_deal for any of them.
# ---------------------------------------------------------------------------
source: capital_markets_tranche
version: "3"
dialect: trino

connection:
  catalog: dataglobe_oraas
  schema: dgstream
  sslmode: require

base_view: dataglobe_oraas.dgstream.vw_tranche_summary

grain: [product, deal_id, tranche_id]

max_limit: 5000
query_timeout_seconds: 60

default_time_dimension: pricing_date

how_to_use:
  - "USE THIS OBJECT for tranche-grain asks: tranche sizing, pricing date,
     currency, coupon/tenor/seniority/rating/maturity (DCM), product type and
     exchange (ECM), security identifiers, syndicate membership, roles, and
     bill-and-deliver. One row per tranche — never deduplicate."
  - "ALSO ANSWER HERE, with NO second object: deal_status, deal_region,
     use_of_proceeds, settlement_currency, sector, issuer_name, issuer_id and
     ticker. They are denormalised onto every tranche row. 'EMEA green bonds
     refinancing debt' and 'settled tranches over 1bn' are each ONE request."
  - "DO NOT ask this object for investor/allocation/demand attributes — use
     capital_markets_order. For deal-level roll-ups (tranche_count, order_count,
     investor_count, the deal currency list) use capital_markets_deal."
  - "ALWAYS set 'product'. ECM tranche sizes are SHARE COUNTS; DCM tranche sizes
     are notional MONEY — for DCM money totals scope one 'currency' or group by
     'currency'. This object is where currency-comparable DCM money lives (the
     deal object's deal_size is not currency-scoped)."
  - "ALWAYS project tranche_name (and tranche_id) when more than one tranche of a
     deal can appear — without it the rows read as duplicated deal names. The
     stable sort/paging key at this grain is deal_id THEN tranche_id: a tranche
     id is near-unique but the same id can legitimately appear under two deals."
  - "MULTI-VALUE COLUMNS — the current roster, it changed. PIPE-DELIMITED
     (' | '): syndicate_member_name, syndicate_role, broker_code, bnd_broker,
     bnd_bank ON ECM, and identifier_type / identifier_value on both products.
     The first four share one ordering inside the view, so the i-th member,
     i-th role, i-th broker code and i-th flag are INTENDED to be the same bank
     — but the lists are built independently and a MISSING value is silently
     omitted rather than left blank, so a list can be SHORTER than the member
     list. COUNT THE ELEMENTS BEFORE YOU PAIR ANYTHING: if two lists have
     different element counts the positions no longer line up, so show them as
     separate lists and say they could not be paired. NEVER attribute a role or
     a B&D flag to a bank by matching two lists separately; that proves both
     values exist somewhere, not that they belong together. COMMA-separated
     (never pipe): issuer_ratings. NO LONGER LISTS — now plain scalars: tenors,
     securities_maturity, delivery_type. Do not apply pipe-token anchors to any
     of those three."
  - "BILL & DELIVER: use the resolved 'bnd_bank' dimension — it names the B&D
     bank directly. NEVER parse or index into the pipe lists to find it; that
     arithmetic is retired. ('Which deals did <bank> bill?' → bnd_bank
     like '%BANK%', metric deal_count.) On ECM bnd_bank can itself hold SEVERAL
     banks separated by ' | ' — co-B&D is common (hundreds of tranches in QA
     alone) — so only 'like' is offered on it; equality would silently miss
     every co-billed tranche. On
     DCM it is a single bank. bnd_bank is_null = no B&D designated, a real
     business case: report it as 'no B&D recorded', not as zero deals."
  - "NON-B&D (participated but did NOT bill) is TWO predicates. Filter
     syndicate_member_name like '%BANK%' (participated), PROJECT bnd_bank, and
     split billed vs not-billed in the answer. Do NOT negate participation — on
     a Citi book that excludes almost every tranche, which was a production
     zero-result bug. Do NOT use bnd_bank ne/not_in — they silently drop the
     no-B&D-recorded tranches that belong in a non-B&D answer. There is no
     not_like operator; the clean form is a governed computed_filter with
     negate, and this source declares none (see the note at the end of file)."
  - "SOLO means CITI-SOLO. deal_sharing_type = 'SOLO' is set only when the
     tranche had exactly ONE syndicate member AND that member is Citigroup
     Global — on BOTH products now. So say 'Citi was the sole syndicate member',
     never a bare 'sole-managed': a tranche solely managed by ANOTHER bank reads
     'SHARED'. 'SHARED' also covers tranches with no syndicate rows at all. Do
     NOT cross-check it against syndicate_member_count — on ECM that count is
     the same test without a DISTINCT, so a duplicated member row can make it
     read 2 on a genuinely SOLO tranche."
  - "IDENTIFIERS: identifier_type and identifier_value are pipe lists ordered
     by (type, value) inside the view, so position i of one belongs to position
     i of the other WHENEVER THE TWO LISTS HAVE THE SAME NUMBER OF ELEMENTS —
     a row missing one side is dropped from that list only, which shifts
     everything after it. Count both lists first; if the counts differ, show
     type and value as two separate lists and say they could not be paired.
     Match with 'like' and case-insensitively — DCM
     stores types lowercase ('cusip'), ECM uppercase ('CUSIP'). When displaying,
     ZIP the two lists by position into ONE cell ('CUSIP 123456789 · FIGI
     12345X') and label the row by tranche.
     NEVER SPLIT A PIPE LIST ACROSS TABLE COLUMNS — doing so shifts every later
     column and made DEAL_ID display an ISIN in production.
     If a cell ends in '...(N)' the list was TRUNCATED at
     the storage limit: say so, and do not treat the two lists as complete."
  - "PER-PRODUCT APPLICABILITY. DCM-ONLY (NULL on ECM): product_class,
     seniority, reg_category, esg_bond, coupon_type, coupon_freq, tenors,
     delivery_type, issuer_ratings, securities_maturity, tranche_status.
     ECM-ONLY (NULL on DCM): product_type, exchange, syndicate_role,
     broker_code, and the multi-bank syndicate list. BOTH PRODUCTS: deal_status,
     deal_region, tranche_region, use_of_proceeds, settlement_currency, sector,
     currency, tranche_size, pricing_date, identifiers, bnd_bank, bnd_broker,
     deal_sharing_type. Filtering outside a field's product returns nothing —
     scope the product first."
  - "STATUS. deal_status is populated on BOTH products here; there is no reason
     to hop to the deal object for it. Its stored values carry CASE VARIANTS
     ('priced' and 'Priced', 'announced' and 'Announced' are distinct stored
     strings), which the case_insensitive filter handles for you on a FILTER —
     but a GROUP BY on deal_status or tranche_status still splits one bucket in
     two, so MERGE the variants before you report a breakdown or the buckets
     will not sum. On DCM, tranche_status and deal_status are the SAME source
     column, so they are identical on every DCM row; the DEAL object's status is
     an aggregate across a deal's tranches and can legitimately differ from the
     per-tranche value shown here — disclose that rather than reconciling it."
  - "VALUE TRAPS on this object (the stored literal is never the spoken word):
     tenors are hyphenated '<value>-<PERIOD>', never '10Y' — and the period
     spelling DRIFTS ('10-YEAR' and '10-Y' both occur, 'M' means months), so
     match the SHORT token '%10-Y%', which catches both; coupon types use SPACES
     not hyphens ('Fixed to FRN', 'Zero Coupon', 'Step Coupon'); coupon frequency
     is 'Semi Annual', not 'Semi-Annual'; reg_category is 'SEC Registered(Public)'
     with NO space before the bracket while delivery_type stores 'RegS' with NO
     space at all; exchange stores full venue names AND sometimes the
     abbreviation, so eq is always wrong and one token may not be enough;
     product_type labels vary ('Common Shares' vs
     '144A Common Stock' — match '%COMMON%'); 'M & A' has SPACES. Match all of
     these with 'like' on the distinguishing token, never equality."
  - "Trailing windows need BOTH bounds (gte start AND lt tomorrow-midnight) so
     future-dated pricings are excluded and today's pricings are not. DCM
     securities_maturity in the future is NORMAL — never filter it out."

# ------------------------------- METRICS ------------------------------------
# UNITS GUARD: every metric over a per-product-unit column declares
# requires_filters: [product] — without it, MAX/SUM compares ECM share counts
# against DCM notional money.
metrics:
  total_tranche_size:
    column: tranche_size
    aggregation: SUM
    numeric: true
    requires_filters: [product]
    description: >-
      Total tranche size. ECM=shares, DCM=notional money. The column is a real
      NUMBER on both products now, so this sums and ranks correctly. For DCM,
      scope one currency or group by currency — this is the currency-comparable
      money metric that the deal object cannot provide.
  largest_tranche_size:
    column: tranche_size
    aggregation: MAX
    numeric: true
    requires_filters: [product]
    description: >-
      Largest single tranche. Use for "biggest tranche". Outlier caution: a DCM
      tranche of 10,000,000,000,000 exists in the data — either a large JPY
      notional or a source error. Always show the currency beside a DCM maximum.
  smallest_tranche_size:
    column: tranche_size
    aggregation: MIN
    numeric: true
    requires_filters: [product]
    description: >-
      Smallest single tranche. WARNING: a tranche with NO size at source is
      stored as 0, so this returns 0 in almost any scope. For the smallest
      RECORDED size add the filter tranche_size gt 0, and say you excluded the
      size-less tranches.
  average_tranche_size:
    column: tranche_size
    aggregation: AVG
    numeric: true
    requires_filters: [product]
    description: >-
      Average tranche size. Diluted by the size-less tranches stored as 0 — add
      tranche_size gt 0 for an average over recorded sizes only, and say so.
  tranche_count:
    column: tranche_id
    aggregation: COUNT_DISTINCT
    description: Number of distinct tranches. Use for "how many tranches".
  deal_count:
    column: deal_id
    aggregation: COUNT_DISTINCT
    description: >-
      Number of distinct deals covered by the matched tranches. Use when the
      user says "deals" but the filter is tranche-level (syndicate, B&D,
      coupon, identifier). A multi-tranche deal must NOT be counted twice.
      This can be LOWER than the deal object's tranche_count implies: that
      object counts tranches without this view's status exclusion.
  issuer_count:
    column: gfcid
    aggregation: COUNT_DISTINCT
    description: Number of distinct issuers.
  syndicate_member_count:
    column: syndicate_member_name
    aggregation: MAX
    list_count: true
    requires_filters: [product]
    description: >-
      ECM. Number of banks in the tranche's syndicate (counts the pipe-delimited
      list). Use with a HAVING threshold for "deals with 5+ syndicate members".
      The list is NOT de-duplicated, so a bank listed twice counts twice — use
      this for "how big was the syndicate", never as a second opinion on
      deal_sharing_type. MEANINGLESS ON DCM — that view exposes only the B&D
      bank, so the count there is 1 (or 0 when no B&D bank is recorded) and
      never the syndicate size; scope product to ECM before using it.
  row_count:
    column: tranche_id
    aggregation: COUNT
    description: >-
      Total matched rows. The view holds its grain, so this equals
      tranche_count — prefer tranche_count in any answer shown to a user.

# ------------------------------ DIMENSIONS ----------------------------------
dimensions:
  product: {column: product, description: "Product — 'ECM' or 'DCM'."}
  # --- deal attributes denormalised down (do not multiply rows) ---
  deal_id: {column: deal_id, description: "Deal id (denormalised). TEXT — quote it. Project it in listings: it is the drill-down handle."}
  deal_name: {column: deal_name, description: "Deal name (display). NOT unique across tranches — always pair with tranche_name."}
  issuer_name: {column: issuer_name, description: "Issuer/company name (display)."}
  issuer_id: {column: gfcid, description: "Issuer GFCID. TEXT — quote it."}
  ticker: {column: ticker, description: "Issuer ticker symbol. A ticker is a direct filter, never an entity to resolve."}
  sector: {column: sector, description: "Issuer industry sector. Closed 28-value list — 'Oil & Gas' is a SEPARATE value from 'Energy'."}
  deal_status: {column: deal_status, description: "Deal lifecycle status, on BOTH products (no hop to the deal object). Case variants exist ('priced'/'Priced') — merge them when you GROUP BY. On DCM this is the same source column as tranche_status."}
  deal_region: {column: deal_region, description: "DEAL-level region (NAM/EMEA/APAC). Wired on both products here. '<region> DEALS' means this; a bare region mention or a tranche-level ask means tranche_region."}
  use_of_proceeds: {column: use_of_proceeds, description: "Purpose of the raise, both products. ECM has a ~19-value vocabulary, DCM only three. A purpose word NEVER implies a product."}
  settlement_currency: {column: settlement_currency, description: "Currency the tranche SETTLES in — distinct from 'currency' (denomination/pricing). Population unmeasured; treat blanks as 'not captured'."}
  # --- tranche grain ---
  tranche_id: {column: tranche_id, description: "Tranche id. Use (deal_id, tranche_id) as the final sort key on every ranking or paged listing — the id alone is near-unique, not guaranteed unique."}
  tranche_name: {column: tranche_name, description: "Tranche name — often a TARGET-MARKET label (UNITED STATES, GERMANY, EMEA, GLOBAL, UK Institutional, DOMESTIC, UNSPECIFIED). 'US tranches' is a tranche_name ask, not an investor-region ask. Group by it to answer 'by target market'."}
  tranche_size: {column: tranche_size, description: "Tranche size as a NUMBER (ECM shares / DCM notional money). 0 means NO size recorded at source; NULL means a size was recorded but could not be parsed. The currency-comparable money figure for DCM."}
  pricing_date: {column: pricing_ts, description: "Tranche pricing timestamp (default time field)."}
  currency: {column: currency, description: "Pricing/denomination currency (scalar at this grain). Required alongside any DCM money figure. Can be NULL on ECM."}
  tranche_region: {column: tranche_region, description: "Tranche target region (NAM/EMEA/APAC). This is the TRANCHE's market, not the investor's geography (that lives on capital_markets_order)."}
  # --- ECM-only ---
  product_type: {column: product_type, description: "ECM. Fine-grained security type ('Common Shares', '144A Common Stock', 'ADR', 'Conv. Bond'). NEVER match with equality — the values are label variants; use like on the class word. For the deal-level instrument CLASS ('common stock', 'convertible') use capital_markets_deal.equity_type."}
  exchange: {column: exchange, description: "ECM. Listing venue — holds FULL venue names AND sometimes the abbreviation itself ('NYSE'); match BOTH tokens with like (full name first, abbreviation on a 0-row retry), never equality. A dual-listed tranche may show only one venue."}
  # --- syndicate (aligned pipe lists) ---
  syndicate_member_name: {column: syndicate_member_name, description: "ECM: pipe-delimited syndicate banks, ordered the same way as syndicate_role/broker_code/bnd_broker (pair by position only when the element counts match). A member token may carry an inline '(true)'/'(false)' suffix duplicating the B&D flag — never filter on it, and STRIP it when displaying the name. DCM: a SINGLE bank string which IS the B&D bank, not the syndicate."}
  syndicate_role: {column: syndicate_role, description: "ECM. Pipe-delimited roles, aligned with syndicate_member_name. NULL on DCM. Display only — never attribute a role to a bank by matching lists."}
  broker_code: {column: broker_code, description: "ECM. Pipe-delimited broker codes, aligned with syndicate_member_name. NULL on DCM."}
  bnd_broker: {column: bnd_broker, description: "ECM: pipe list of 'true'/'false', one per syndicate member, aligned with the member list; no member name is embedded in it. DCM: a SCALAR computed as 'is the B&D bank Citigroup Global', with NO null branch — so 'false' covers BOTH 'another bank billed' AND 'no B&D bank recorded at all', and it is never NULL on DCM. Split those two cases with bnd_bank is_null. Legacy either way; prefer bnd_bank."}
  bnd_bank: {column: bnd_bank, description: "RESOLVED bill-and-deliver bank NAME(S). ECM can hold SEVERAL banks in one ' | ' list (co-B&D); DCM is a single bank. NULL = no B&D designated. Use this for ALL B&D asks."}
  deal_sharing_type: {column: deal_sharing_type, description: "'SOLO' = Citi was the ONLY syndicate member (both products). 'SHARED' = everything else, including a tranche solely managed by another bank and a tranche with no syndicate rows. Never render SOLO as a bare 'sole-managed'."}
  # --- identifiers (aligned pipe lists) ---
  identifier_type: {column: identifier_type, description: "Pipe-delimited identifier types (CUSIP/ISIN/FIGI/RIC/Valoren/'SMCP ID'/'DirectBooks Id'), zip-aligned with identifier_value. Casing differs per product (DCM lowercase, ECM uppercase)."}
  identifier_value: {column: identifier_value, description: "Pipe-delimited identifier values, zip-aligned with identifier_type. Display ZIPPED with the type list into one cell per tranche. A security identifier is never a deal_id and never an entity."}
  # --- DCM-only ---
  product_class: {column: product_class, description: "DCM. Bond class — a closed 15-value list (Investment Grade, High Yield, SSA, ABS…). Expand IG/HY/EM before filtering."}
  coupon_type: {column: coupon_type, description: "DCM. Coupon STRUCTURE (Fixed, FRN, Zero Coupon, Fixed to FRN, Step Coupon…) — SPACES, not hyphens. It is not a rate; never present 'Fixed' as 'the coupon'."}
  coupon_freq: {column: coupon_freq, description: "DCM. Annual, Semi Annual, Quarterly, Monthly, Weekly, Zero, At Maturity, Daily."}
  tenors: {column: tenors, description: "DCM. Scalar tenor label built as '<value>-<PERIOD>' — the hyphen is always there, so never '10Y'. The PERIOD spelling drifts ('10-YEAR' and '10-Y' both occur; 'M' is months), so match the short token '%10-Y%'. NULL when no tenor was recorded (a large, real population). No longer a pipe list and no longer aligned with securities_maturity."}
  seniority: {column: seniority, description: "DCM. Rank in the capital structure (Senior Secured, Senior Unsecured, Subordinated…). An ECM 'senior secured convertible' ask is an equity_type ask, not this."}
  reg_category: {column: reg_category, description: "DCM. Regulatory category — stored as 'SEC Registered(Public)' (no space before the bracket), '144A', 'Reg S'… A bare '144A'/'Reg S'/'3(a)(2)' ask, and a 'delivery type SEC Registered' ask, both route HERE."}
  delivery_type: {column: delivery_type, description: "DCM. Legal delivery type — a SCALAR now, only three values: '144A', 'RegS' (no space), '3(a)(2) Exempt'. Use only when the user says 'delivery'."}
  esg_bond: {column: esg_bond, description: "DCM. GREEN / SUSTAINABILITY / SOCIAL. NULL means not an ESG-labelled bond."}
  issuer_ratings: {column: issuer_ratings, description: "DCM. COMMA-separated ratings, each rendered 'AGENCY - VALUE(OUTLOOK)' and ordered by agency. The AGENCY NAME IS IN THE STRING, so match the agency directly. This is the only place a rating outlook is exposed. Never a pipe list."}
  securities_maturity: {column: securities_maturity, description: "DCM. Maturity DATE (a real date, the only one on this object). Future maturities are normal — never treat them as invalid or filter them out."}
  tranche_status: {column: tranche_status, description: "DCM. Tranche lifecycle status — the SAME source column as deal_status on DCM, so the two are identical there. NULL on every ECM row; for ECM status use deal_status, which is on THIS object."}

# -------------------------------- FILTERS -----------------------------------
filters:
  product:
    column: product
    operators: [eq, in]
    suggestable: true
    values: ["ECM", "DCM"]
    description: "Product scope — 'ECM' or 'DCM'. Set on every query."
  deal_id: {column: deal_id, operators: [eq, ne, in, not_in], description: "Filter by deal id (TEXT — quote it). 0 rows for a labelled id means no data for that id; never substitute a lookalike."}
  tranche_id: {column: tranche_id, operators: [eq, ne, in, not_in], description: "Filter by tranche id (TEXT — quote it)."}
  deal_name:
    column: deal_name
    operators: [like, eq, in]
    suggestable: true
    entity_name: true
    entity_id_column: deal_id
    case_insensitive: true
    description: "Filter by deal name — like '%NAME%'. No id lookup needed."
  issuer_name:
    column: issuer_name
    operators: [like, eq, in]
    suggestable: true
    entity_name: true
    entity_id_column: gfcid
    case_insensitive: true
    description: "Filter by issuer/company name — like '%NAME%'. No id lookup needed."
  issuer_id: {column: gfcid, operators: [eq, ne, in, not_in], description: "Issuer-side filter (GFCID, text — quote it)."}
  ticker:
    column: ticker
    operators: [eq, ne, in, not_in, like]
    case_insensitive: true
    description: "Issuer ticker. A ticker is a direct filter — never send it to entity resolution."
  tranche_name:
    column: tranche_name
    operators: [like, eq, in, not_in]
    suggestable: true
    case_insensitive: true
    description: >-
      Tranche name — usually a target-market label ('UNITED STATES', 'GERMANY',
      'EMEA', 'GLOBAL', 'UK Institutional', 'DOMESTIC', 'UNSPECIFIED') plus free
      custom names. 'US tranches' → like '%UNITED STATES%'. Grouping by this
      dimension is how 'by target market' is answered.
  tranche_size:
    column: tranche_size
    operators: [gt, gte, lt, lte, between, eq, is_null, is_not_null]
    description: >-
      ROW-LEVEL tranche-size threshold, on a real NUMBER. Pair with product, and
      with currency for DCM — the unit differs by product. NULL SEMANTICS, and
      they are not the intuitive ones: eq 0 means NO SIZE RECORDED at source
      (use it to answer "tranches with no size"), while is_null means a size WAS
      recorded but could not be parsed (rare). Add gt 0 whenever a minimum, an
      average or a ranking should ignore the size-less tranches.
  currency:
    column: currency
    operators: [eq, ne, in, not_in, is_null, is_not_null]
    suggestable: true
    case_insensitive: true
    description: >-
      Pricing/denomination currency (ISO codes — USD, EUR, GBP, JPY, CNY, CNH).
      Required for comparable DCM money totals; there is no FX column. Can be
      NULL on ECM, so a ne/not_in predicate silently drops those rows — count
      them with is_null and disclose the number. 'RMB' means CNY and CNH: say
      which you used.
  settlement_currency:
    column: settlement_currency
    operators: [eq, ne, in, not_in, is_null, is_not_null]
    # NOT suggestable, matching capital_markets_deal: the population is unmeasured and
    # the view team treats the column as a placeholder, so a 0-row result would
    # buy an unscoped SELECT DISTINCT that may have nothing to suggest. An empty
    # result here is meant to read as "not captured", which is what the
    # description says.
    case_insensitive: true
    description: >-
      The currency the tranche SETTLES in — a DIFFERENT column from 'currency'
      (denomination/pricing). Population is UNMEASURED and the view team treats
      it as a placeholder, so an empty result here means "not captured", not
      "no such tranches" — say that rather than reporting zero. Comparing it to
      'currency' in one request is not expressible today (no column-vs-column
      predicate is declared on this source).
  tranche_region:
    column: tranche_region
    operators: [eq, ne, in, not_in, is_null, is_not_null]
    suggestable: true
    case_insensitive: true
    description: >-
      Tranche target region — NAM, EMEA, APAC. A NOT-region predicate also drops
      NULL-region rows — count them with is_null and disclose the number.
  deal_region:
    column: deal_region
    operators: [eq, ne, in, not_in, is_null, is_not_null]
    suggestable: true
    case_insensitive: true
    description: >-
      DEAL-level region — NAM, EMEA, APAC (there is no 'AMER'). Wired on both
      products on this object, so an "EMEA deals with a 10-year tenor" ask is
      ONE request here. Use it only for a DEAL noun; a tranche/bond noun or a
      bare region mention is tranche_region. ECM is populated but the source
      carries CONFLICTING regions on some transactions and the view keeps the
      alphabetically-last, so a per-deal region is a best-guess, not a fact
      worth footnoting. DCM population is unmeasured — if it comes back empty,
      fall back to tranche_region and say you did. A NOT-region predicate drops
      NULL-region rows: count and disclose.
  deal_status:
    column: deal_status
    operators: [eq, ne, in, not_in, like, is_null, is_not_null]
    suggestable: true
    case_insensitive: true
    description: >-
      Deal lifecycle status, populated on BOTH products — do not hop to the deal
      object for it. Matching here is case-insensitive, which is mandatory
      because the stored vocabulary contains CASE-VARIANT DUPLICATES. DCM values
      observed in full: Settled, priced, Priced, announced, Announced, draft,
      freeToTrade, cancelled, allocated, subject, archived, deleted, postponed,
      confidential, 'Final Settled', and NULL — that list is MEASURED and
      complete. ECM is different in kind: the column is the transaction's
      EXECUTION-status value (the view keeps one per transaction, choosing the
      alphabetically-last where a transaction carries conflicting ones), and its
      vocabulary has NOT been measured. Carried over unverified — the SAME 15
      literals capital_markets_deal and the skill list, because it is the same source
      column on both objects: Priced, Settled, Live, Executed, Draft, Announced,
      Allocated, Subject, Archived, FreeToTrade, Postponed, Cancelled, Deleted,
      OPEN, CLOSED. 'Executed' belongs here precisely BECAUSE this is the
      execution-status value. 'Mandated' and 'Private' are deliberately NOT on
      this list: the reference dictionary files them under DCM (ODT.STATUS), and
      Q17 measured the DCM vocabulary COMPLETELY without either of them — so
      they are attested nowhere and must not be offered as ECM values. On ECM
      prefer 'like' on the distinguishing token and never treat an unlisted
      value as impossible. TWO ROW-EXCLUSION FACTS the
      answer must respect: on ECM the view drops Confidential, Withdrawn and
      Terminated entirely, so an ECM ask for those is zero BY CONSTRUCTION — say
      it is not available rather than "none found"; on DCM nothing is excluded,
      so cancelled/deleted/archived/draft/postponed/confidential tranches ARE in
      every unfiltered DCM result. Humanise 'freeToTrade' as 'Free to Trade'.
  tranche_status:
    column: tranche_status
    operators: [eq, ne, in, not_in, like, is_null, is_not_null]
    suggestable: true
    case_insensitive: true
    description: >-
      DCM only — NULL on every ECM row, so an ECM-scoped filter here returns
      zero; use deal_status, which is on this object for both products. Same
      value set as deal_status on DCM (it is the same source column), including
      the case variants and a NULL bucket.
  sector:
    column: sector
    operators: [eq, ne, in, not_in, like]
    suggestable: true
    case_insensitive: true
    description: >-
      Issuer sector — a CLOSED list of stored labels: Aero/Defense, Agriculture,
      Autos, Banks, Chemical, Consumer Goods, Energy, Financial Services,
      Government, Healthcare, Homebuilding, Industrials, Information Technology,
      Insurance, Media, MLPS, Natural resources, Oil & Gas, Paper and Packaging,
      Pharmaceuticals, Pipelines, Real Estate, Retail, Services, Technology,
      Telecommunications, Transportation, Utilities. 'Oil & Gas' is NOT filed
      under 'Energy' and 'Information Technology' is not 'Technology': an
      "energy" ask should use 'in' with every qualifying value, and the answer
      must state which ones were included. Wired on DCM as well as ECM, but the
      reference dictionary marks sector ECM-only and DCM population is
      unmeasured — if a DCM-scoped sector filter returns zero, that is the
      likely reason: say so rather than reporting 'no such deals'.
  use_of_proceeds:
    column: use_of_proceeds
    operators: [eq, ne, in, not_in, like]
    suggestable: true
    case_insensitive: true
    description: >-
      Purpose of the raise, both products, on THIS object — no hop. Stored ECM
      labels: Acquisitions, Capital Expenses, Capital Restructure, Debt Repayment,
      Future Acquisitions, General Corporate Purposes, Growth Capital,
      Investments, Legal Redemptions, 'M & A', No Proceeds to Issuer, Project
      Finance, Recapitalization, Refinance, Research and Development, Share
      Repurchase, Shareholder Dividends, Working Capital Requirement, 'N/A'. DCM
      has only three: General Corporate Purposes, Repay Outstanding Borrowings,
      Other. SHORTHAND MAP — refinancing/repay debt → in ['Refinance',
      'Debt Repayment','Repay Outstanding Borrowings'] (a two-value 'in' MISSES
      every DCM refinancing, and '%DEBT REPAY%' misses it too); M&A/merger/
      acquisition → in ['M & A','Acquisitions','Future Acquisitions'] — the
      spoken word 'M&A' matches NOTHING as a literal ('M & A' has spaces) and
      like '%M & A%' alone silently drops both Acquisitions values; capex →
      '%CAPITAL EXPENSE%'; buyback → '%SHARE REPURCHASE%'; GCP →
      '%GENERAL CORPORATE%'; R&D → '%RESEARCH%'; dividend → '%DIVIDEND%';
      working capital → '%WORKING CAPITAL%'; recap → '%RECAPITAL%'. (Identical
      to the map on capital_markets_deal — same vocabulary, same column.)
      'N/A' and 'No Proceeds to Issuer' mean PURPOSE NOT STATED — exclude them
      from a purpose breakdown and say so. A purpose word NEVER implies a
      product; both products raise for all purposes.
  product_type:
    column: product_type
    operators: [like, in, not_in]
    suggestable: true
    case_insensitive: true
    description: >-
      ECM. Security type label. Prefer 'like' on the class word — the values are
      label variants; use 'in' ONLY with values copied exactly from the list
      below (it is the sole way to express an OR, since filters are ANDed).
      Observed:
      144A Common Stock, ADR, ADS, GDR, ADR Conv. Pref, American Depositary
      Note, Class A Common Stock, Common Shares, Common Shares of Beneficial
      Interest, Common Stock, Common Units, Conv. Bond, Conv. Pfd, Convertible
      Subordinated Notes, Equity Unit, Exchangable Sr. Notes, Exchangeable
      Senior Unsecured Notes, High Yield, Holder Shares, Locals, Mandatory
      Convertible Preferred Stock, Note, Ord Shares, Rights, Shares, Units,
      Warrant (the abbreviations keep their periods; QA also holds test junk, so
      an unlisted value is not impossible). Match the CLASS WORD ('%COMMON%',
      '%ADR%', '%CONV%'), never the user's exact phrasing. This column owns the
      exclusive vocabulary ADR/ADS/GDR/GDS, 144A, Class A, Rights, Conv. Bond,
      Conv. Pfd, Mandatory Convertible. For the deal-level instrument class
      ('common stock', 'convertible', 'warrants') use capital_markets_deal.equity_type,
      and NEVER blend the two — they are different axes.
  exchange:
    column: exchange
    operators: [like, in, not_in]
    suggestable: true
    case_insensitive: true
    description: >-
      ECM. Listing venue. The column holds FULL venue names AND, on some rows,
      the ABBREVIATION itself — both spellings are stored, so equality is always
      wrong (eq 'NYSE' returns zero on every full-name row) and neither single
      'like' token is guaranteed complete. Filters are ANDed and there is no OR,
      so you cannot match both tokens in one request: run the FULL-NAME token
      first, and if it returns 0 rows RETRY with the abbreviation before saying
      there are none. Expansions (unverified against the stored literals — treat
      an empty result as a spelling miss, not an absence): NYSE → '%NEW YORK%'
      then '%NYSE%'; NASDAQ → '%NASDAQ%' (same either way); LSE → '%LONDON%'
      then '%LSE%'; TSX → '%TORONTO%'; HKEX → '%HONG KONG%';
      SSE → '%SHANGHAI%'; TSE → '%TOKYO%'; ASX → '%AUSTRALIA%'. Say which venue
      spelling the answer matched. A tranche listed on two venues may report
      only one (the view keeps MAX(EXCHANGE) across the source rows), so treat
      this as the primary venue, not an exhaustive list.
  syndicate_member_name:
    column: syndicate_member_name
    operators: [like, is_null, is_not_null]
    case_insensitive: true
    description: >-
      Pipe list on ECM (a single B&D bank string on DCM) — 'like %BANK%' means
      the bank participated somewhere in the syndicate. Match a bank by its
      STEM, never equality. 'Citi' means ONLY the five Citigroup Global Markets
      subsidiaries — like '%CITIGROUP GLOBAL MARKETS%'; a name merely containing
      'Citi' (CITIBANK, test entities) is NOT Citi for syndicate or B&D
      purposes. Other stems: '%JPMORGAN%'/'%JP MORGAN%', '%GOLDMAN%',
      '%MORGAN STANLEY%', '%BARCLAYS%', '%BANK OF AMERICA%'/'%MERRILL%',
      '%JEFFERIES%', '%ABN AMRO%', '%CREDIT SUISSE%'. There is no not_like
      operator, and NEVER negate participation to mean "another bank led it" —
      this is Citi's own book, so excluding Citi excludes almost every tranche
      (a production zero-result bug). For "participated but did not bill" see
      how_to_use.
  broker_code:
    column: broker_code
    operators: [like, is_null, is_not_null]
    case_insensitive: true
    description: >-
      ECM. Pipe list of broker codes, aligned with the member list. NULL on DCM.
      Citi codes: CITIDEV, CITIUSA, CITIAUS, CITIASIA, CITIUKE, CITGMCA. Others
      seen: JPMSEC/JPMORSEC, GSCO/SGAMER, MSCO, BARCAP, BAMLS, JEFFLLC,
      ABNAMBK/ABNAFS, CSFBHK. Filters are ANDed, so several codes for one bank
      cannot be combined in one predicate — prefer syndicate_member_name.
  bnd_bank:
    column: bnd_bank
    operators: [like, is_null, is_not_null]
    case_insensitive: true
    description: >-
      RESOLVED bill-and-deliver bank NAME(S). 'Which deals did Citi bill?' →
      like '%CITIGROUP%', metric deal_count. ONLY 'like' is offered: on ECM this
      cell can hold SEVERAL banks in one ' | ' list (co-B&D runs to hundreds of
      tranches in QA alone), so equality or an 'in' list would miss every co-billed
      tranche — a wrong population with no safety net. is_null = no B&D
      designated on the tranche: report that as "no B&D recorded", not as zero
      deals. There is no not_like operator, and negation is deliberately not
      offered here because it drops the no-B&D rows a non-B&D answer is partly
      about — see the NON-B&D recipe in how_to_use.
  bnd_broker:
    column: bnd_broker
    operators: [like, eq, is_null, is_not_null]
    case_insensitive: true
    description: >-
      Legacy flag — prefer bnd_bank. ECM: a pipe list of 'true'/'false' aligned
      with the member list, so only 'like' is meaningful and it tells you a B&D
      exists, not who. DCM: a SCALAR computed as 'is the B&D bank Citigroup
      Global', and it has NO null branch — a tranche with NO B&D bank at all
      also stores 'false'. So eq 'false' on DCM returns "another bank billed"
      AND "nobody billed" MIXED TOGETHER; never report it as "somebody else
      billed". To separate them, project or filter bnd_bank (is_null = no B&D
      recorded). is_null on this column is ECM-only — on DCM it always returns
      zero rows because the CASE always yields a value.
  syndicate_role:
    column: syndicate_role
    operators: [like]
    case_insensitive: true
    description: >-
      ECM. Pipe list of roles, aligned with the member list; NULL on DCM. Values
      seen: Sole Bookrunner, Lead Manager/Bookrunner, Global Coordinator and
      Bookrunner, Global Coordinator, Active Bookrunner, Passive Bookrunner,
      Joint Bookrunner, Bookrunner, Co-Manager, Selling Group, Bill and Deliver.
      Expand the user's phrase to the stored wording ('lead' → '%LEAD%',
      'b&d' → '%BILL AND DELIVER%'), never match their literal phrasing. Proves
      a role exists on the tranche, NOT which bank held it. Display only.
  deal_sharing_type:
    column: deal_sharing_type
    operators: [eq, ne, in]
    suggestable: true
    values: ["SOLO", "SHARED"]
    case_insensitive: true
    description: >-
      'SOLO' = the tranche had exactly ONE syndicate member and that member is
      Citigroup Global — checked on BOTH products now, so the old "which reading
      did you use" hedge is retired. Report it as 'Citi was the sole syndicate
      member', never a bare 'sole-managed': a tranche solely managed by another
      bank reads 'SHARED', and so does a tranche with no syndicate rows at all.
      Never null.
  identifier_type:
    column: identifier_type
    operators: [like, is_null, is_not_null]
    case_insensitive: true
    description: >-
      Pipe list — like '%CUSIP%'. Values: CUSIP, ISIN, FIGI, RIC, Valoren,
      'SMCP ID', 'DirectBooks Id'. Case differs per product (DCM lowercase, ECM
      uppercase), so case-insensitive matching is mandatory — a case-sensitive
      pattern silently misses every DCM row.
  identifier_value:
    column: identifier_value
    operators: [like, is_null, is_not_null]
    case_insensitive: true
    description: >-
      Pipe list — like '%<id>%'. An ISIN embeds the CUSIP (country code + CUSIP
      + check digit), so a contains match on a CUSIP finds the ISIN too. Values
      can be UUIDs (DirectBooks).
  product_class:
    column: product_class
    operators: [eq, ne, in, not_in, like]
    suggestable: true
    case_insensitive: true
    description: >-
      DCM. Bond class — closed 15-value list: Investment Grade, Preferred,
      Emerging Market, Covered Bond, High Yield, Agencies, CLO, LevFin Loan,
      Asset Backed, SSA, Taxable Muni, ABS, RMBS, CMBS, Municipals. EXPAND the
      abbreviation and never filter on it: IG → 'Investment Grade',
      HY / junk → 'High Yield', EM → 'Emerging Market', muni → 'Municipals' or
      'Taxable Muni', leveraged loan → 'LevFin Loan'. 'IG'/'high yield' asks
      belong here, not on seniority.
  coupon_type:
    column: coupon_type
    operators: [eq, ne, in, not_in, like]
    suggestable: true
    case_insensitive: true
    description: >-
      DCM. Closed 9-value list, SPACES not hyphens: Fixed, FRN, Zero Coupon,
      Fixed to FRN, Fixed to Fixed, Exchanged, Structured, Funged, Step Coupon.
      floating/floater → FRN; fixed-to-float → 'Fixed to FRN' (the hyphenated
      spelling matches nothing); step-up → 'Step Coupon'. This is a STRUCTURE,
      not a rate — the coupon rate is not stored.
  coupon_freq:
    column: coupon_freq
    operators: [eq, ne, in, not_in, like]
    suggestable: true
    case_insensitive: true
    description: >-
      DCM. Closed 8-value list: Annual, Semi Annual, Quarterly, Monthly, Weekly,
      Zero, At Maturity, Daily. 'Semi-Annual' with a hyphen is not the stored
      form.
  tenors:
    column: tenors
    operators: [like, eq, in, is_null, is_not_null]
    case_insensitive: true
    description: >-
      DCM. Scalar label built as '<value>-<PERIOD>'. The value and the hyphen
      are reliable; the PERIOD SPELLING IS NOT — both '10-YEAR' and '10-Y' occur
      and 'M'/'MONTH' is months. So match the SHORT token: '%10-Y%' catches
      '10-YEAR' and '10-Y' alike, where '%10-YEAR%' returns zero on every
      short-form row. Years and months are DIFFERENT tenors — '%6-M%' is six
      months, '%6-Y%' six years; never conflate them. MIND THE DIGIT BOUNDARY:
      '%2-Y%' also matches '12-Y' and '22-Y'. is_null is a large, real
      population (thousands of tranches in QA have no tenor recorded); a handful
      of rows carry half a label ('5-' or '-Y') because one side was missing.
      A tenor RANGE ask ('more than 7 years') cannot be done with arithmetic on
      a text label — enumerate the qualifying labels or ask which tenors.
  seniority:
    column: seniority
    operators: [eq, ne, in, not_in, like]
    suggestable: true
    case_insensitive: true
    description: >-
      DCM. Closed list: Senior Secured, Senior Unsecured, Subordinated, Junior
      Subordinated, Preferred, 1st Lien, 2nd Lien, 3rd Lien, ESOP, Senior Bank,
      Sub Bank, Senior holdco, Sub Holdco, Senior Preferred, Senior
      Non-Preferred, Senior Sub, FRCS. 'Tier 2' is NOT a stored value — do not
      offer it. An ECM 'senior secured convertible' ask is an equity_type ask.
  reg_category:
    column: reg_category
    operators: [eq, ne, in, not_in, like]
    suggestable: true
    case_insensitive: true
    description: >-
      DCM. Closed 9-value list: 'SEC Registered(Public)' (NO space before the
      bracket), 'Yankee CD', '3(A)(2) (SEC Exempt)', '144A', 'Reg S' (WITH a
      space), 'Accredited Investors', 'Domestic', 'Eurobond', 'Private
      Placement'. Match with like ('%SEC REGISTERED%'). A bare '144A'/'Reg S'/
      '3(a)(2)' token routes HERE, and so does a 'delivery type SEC Registered'
      ask — 'SEC Registered' is not a delivery_type value.
  delivery_type:
    column: delivery_type
    operators: [eq, ne, in, not_in, like]
    suggestable: true
    case_insensitive: true
    description: >-
      DCM. A SCALAR with only three stored labels — '144A', 'RegS' (NO space, unlike
      reg_category's 'Reg S'), '3(a)(2) Exempt'. Now that it is scalar, eq and
      in match properly. Use ONLY when the user says 'delivery'; note that a
      handful of tranches had more than one delivery type at source and the view
      keeps one.
  esg_bond:
    column: esg_bond
    operators: [eq, ne, in, not_in, like, is_null, is_not_null]
    suggestable: true
    case_insensitive: true
    description: >-
      DCM. GREEN / SUSTAINABILITY / SOCIAL. green → '%GREEN%'; social →
      '%SOCIAL%'; sustainability / sustainable / SLB → '%SUSTAINAB%'.
      is_not_null = 'ESG bonds' as a whole; is_null = not an ESG-labelled bond.
      NULL IS THE MAJORITY HERE, so 'non-green bonds' is is_null (or is_null OR
      another label, which needs two requests) — NEVER ne 'GREEN', which keeps
      only the SOCIAL and SUSTAINABILITY rows and silently drops every ordinary
      bond.
  issuer_ratings:
    column: issuer_ratings
    operators: [like, is_null, is_not_null]
    case_insensitive: true
    description: >-
      DCM. Comma-separated ratings, each element rendered
      'AGENCY - VALUE(OUTLOOK)' and ordered by agency. THE AGENCY NAME IS IN THE
      STRING, so match the agency directly and robustly — like '%MOOD%' for
      Moody's, '%FITCH%' for Fitch — rather than guessing at notation. Match on
      a short agency STEM: the exact stored spelling has not been verified. Use
      notation only when the user names a specific grade, and use the
      agency-correct notation: Moody's writes Aaa/Aa1/A2/Baa1/Ba1/B1/Caa1, S&P
      and Fitch write AAA/AA+/A-/BBB+/BB+/CCC — 'AAA Moody's' is the user's
      error, not a stored value. Rating-agency NAMES are never entities — never
      resolve them. Not pipe-delimited: never apply pipe token anchors here.
  securities_maturity:
    column: securities_maturity
    operators: [eq, gt, gte, lt, lte, between, is_null, is_not_null]
    description: >-
      DCM. A real DATE, so range and between comparisons work as dates (they
      used to be string comparisons). Future maturities are normal — never treat
      them as invalid or filter them out. NULL on every ECM row.
  pricing_date:
    column: pricing_ts
    operators: [eq, gt, gte, lt, lte, between, is_null, is_not_null]
    description: "Tranche pricing timestamp. Trailing windows need both bounds (gte start, lt tomorrow-midnight)."

unsupported_intents:
  syndicate_on_dcm:
    patterns: ["syndicate members on the bond", "co-managers", "bookrunners for the DCM deal", "how many banks"]
    reason: >-
      On DCM the view exposes a single member — the B&D bank — not the full
      syndicate, so member counts, "5+ syndicate" thresholds and role questions
      are ECM-only.
    user_message: >-
      For DCM I can only see the bill-and-deliver bank, not the rest of the
      syndicate. I can show that, or answer the same question for ECM deals.
  role_attribution:
    patterns: ["who was the bookrunner", "which bank was lead on", "what role did citi have"]
    reason: >-
      syndicate_role is a pipe list aligned by position with the member list;
      the compiler cannot match a role to a named bank, and doing it by
      independent contains-matching produces false attributions.
    user_message: >-
      I can show the full syndicate and the list of roles on the tranche, but I
      can't reliably say which bank held which role. Want the tranche's members
      and roles side by side?
  ecm_league_table:
    patterns: ["league table", "rank the banks", "market share by bank", "who was number 1"]
    reason: >-
      ECM syndicate members are stored as one pipe list per tranche and cannot
      be split per bank, so no per-bank ranking can be built. On DCM the only
      bank exposed is the bill-and-deliver bank, so a DCM ranking is a B&D
      ranking, never a bookrunner league table.
    user_message: >-
      I can't build a bank league table — the ECM syndicate is stored as one
      list per tranche, so it can't be split per bank. I can show the deals a
      single named bank participated in, or rank the bill-and-deliver banks on
      the DCM side. Which would help?
  hedge_securities_count:
    patterns: ["hedge securities", "more than one hedge security", "hedge security count"]
    reason: No hedge-security column is exposed.
    user_message: >-
      Hedge-security counts aren't tracked. I can show the tranche's security
      identifiers or product type instead.
  selling_restrictions:
    patterns: ["selling restriction", "restricted in", "can it be sold in"]
    reason: No selling-restriction column is exposed.
    user_message: >-
      Selling restrictions by country aren't captured. Regulatory category
      (144A / Reg S / SEC Registered) is the closest available field.
  pricing_economics:
    patterns: ["coupon rate", "what coupon", "re-offer price", "issue price", "yield of", "yield to maturity", "spread over", "spread to benchmark", "fees", "gross spread", "underwriting fee"]
    reason: >-
      No price, yield, spread or fee columns exist on this view — only coupon
      TYPE and FREQUENCY, which are structures, not rates.
    user_message: >-
      The pricing level (coupon rate / yield / spread / price) and fee economics
      aren't available here. I can show the coupon type, coupon frequency, tenor
      and maturity for the tranche instead. Would that help?

usage_notes:
  - Always set a product filter. One row per tranche — no deduplication.
  - "REJECTED WITHOUT A 'product' FILTER (the server raises
    missing_required_filter — putting product in dimensions does NOT satisfy
    it): total_tranche_size, largest_tranche_size, smallest_tranche_size,
    average_tranche_size, syndicate_member_count. Every OTHER metric here —
    tranche_count, deal_count, issuer_count, row_count — is unit-free and needs
    no product filter, so one request with 'product' in dimensions covers both."
  - DCM money totals need a single currency scope or group by currency; this is
    the object that makes DCM money comparable. ECM sizes are share counts and
    carry no currency — do not show one on an ECM size answer.
  - "deal_status, deal_region, use_of_proceeds, settlement_currency, sector and
    the issuer fields are ON THIS OBJECT. Never send a tranche ask to the deal
    object just to pick one of them up."
  - "'Execution status' is not a separate concept here: the physical
    execution-status column carries one constant value on ECM and nothing on
    DCM, so it is deliberately NOT exposed. Route every execution/lifecycle
    status ask to deal_status."
  - Status comparisons are case-insensitive on the filter, but a GROUP BY on
    deal_status or tranche_status still splits 'priced' from 'Priced' — merge
    the case variants before reporting, or the buckets will not sum.
  - Pipe lists are position-aligned; never attribute a role or flag to a bank by
    matching two lists. Use bnd_bank for B&D, and never index into the lists.
  - Identifier and syndicate lists are displayed ZIPPED into one cell per
    tranche, never split across columns — and only when the lists being zipped
    hold the SAME number of elements; unequal counts mean a value was missing
    and the positions have shifted, so show them separately instead. A trailing
    '...(N)' marks a truncated list — disclose it as data loss rather than
    presenting it as complete.
  - Always project tranche_name alongside deal_name so multi-tranche deals do
    not read as duplicate rows.
  - EVERY ranking or paged request ends its 'order' with a UNIQUE KEY
    (tranche_id here, after deal_id). deal_name and tranche_name are not unique.
  - "tranche_size is a NUMBER: rankings and thresholds are numeric now. 0 means
    no size recorded, NULL means an unparseable source value — add
    tranche_size gt 0 to any minimum or average that should ignore them."
  - ECM-only fields (product_type, exchange, syndicate_role, broker_code, the
    multi-bank syndicate list) are NULL or single-valued on DCM; DCM-only fields
    (product_class, seniority, reg_category, esg_bond, coupon_type, coupon_freq,
    tenors, delivery_type, issuer_ratings, securities_maturity, tranche_status)
    are NULL on ECM.
  - Trailing windows need BOTH bounds (gte start AND lt tomorrow-midnight).
  - "NEGATION DROPS NULLS on every column here — ne/not_in never match a NULL.
    On the DCM-only columns (esg_bond, seniority, coupon_type, tenors,
    delivery_type, reg_category, issuer_ratings …) NULL is often the LARGEST
    bucket, so a NOT-predicate answers a much smaller question than the user
    asked. Use is_null when 'not X' means 'not labelled at all', and count and
    disclose the excluded NULLs whenever you do negate."
  - Ids (deal_id, tranche_id, gfcid) are TEXT — quote them and keep leading zeros.

examples:
  - question: Security identifiers for a deal, per tranche
    request:
      source: capital_markets_tranche
      metric: tranche_count
      dimensions: [tranche_name, tranche_id, identifier_type, identifier_value, ticker]
      filters:
        - {field: product, op: eq, value: ECM}
        - {field: deal_id, op: eq, value: "REPLACE_WITH_DEAL_ID"}
      order: [{field: tranche_id, direction: asc}]
      # Display: zip identifier_type with identifier_value by position into ONE
      # cell per tranche ("CUSIP 123456789 · ISIN US1234567890").
  - question: Which deals did Citi bill and deliver in 2024 (ECM)
    request:
      source: capital_markets_tranche
      metric: deal_count
      dimensions: [deal_name, deal_id, bnd_bank]
      filters:
        - {field: product, op: eq, value: ECM}
        # 'like' only — an ECM bnd_bank cell can name two co-B&D banks.
        - {field: bnd_bank, op: like, value: "%CITIGROUP%"}
        - {field: pricing_date, op: gte, value: "2024-01-01"}
        - {field: pricing_date, op: lt, value: "2025-01-01"}
      order: [{field: deal_count, direction: desc}, {field: deal_id, direction: asc}]
  - question: Citi non-B&D deals in 2024 (participated but did not bill, ECM)
    request:
      source: capital_markets_tranche
      metric: deal_count
      # Project bnd_bank so the billed/not-billed split can be made in the
      # answer. No computed_filters are declared on this source, and negating
      # bnd_bank would drop tranches with NO B&D recorded — which belong in a
      # non-B&D answer.
      dimensions: [deal_name, deal_id, bnd_bank]
      filters:
        - {field: product, op: eq, value: ECM}
        # Participated. NEVER negate this to mean "someone else led".
        - {field: syndicate_member_name, op: like, value: "%CITIGROUP%"}
        - {field: pricing_date, op: gte, value: "2024-01-01"}
        - {field: pricing_date, op: lt, value: "2025-01-01"}
      order: [{field: deal_count, direction: desc}, {field: deal_id, direction: asc}]
  - question: Top 10 DCM tranches by size in USD, 2025
    request:
      source: capital_markets_tranche
      metric: total_tranche_size
      dimensions: [deal_name, tranche_name, tranche_id, currency]
      filters:
        - {field: product, op: eq, value: DCM}
        - {field: currency, op: eq, value: USD}
        # Exclude the tranches with no size recorded (stored as 0).
        - {field: tranche_size, op: gt, value: 0}
        - {field: pricing_date, op: gte, value: "2025-01-01"}
        - {field: pricing_date, op: lt, value: "2026-01-01"}
      order: [{field: total_tranche_size, direction: desc}, {field: tranche_id, direction: asc}]
      limit: 10
  - question: Deals with five or more syndicate members (ECM, 2025)
    request:
      source: capital_markets_tranche
      metric: syndicate_member_count
      dimensions: [deal_name, deal_id, tranche_name, tranche_id]
      filters:
        - {field: product, op: eq, value: ECM}
        - {field: pricing_date, op: gte, value: "2025-01-01"}
        - {field: pricing_date, op: lt, value: "2026-01-01"}
      having: [{metric: syndicate_member_count, op: gte, value: 5}]
      order: [{field: syndicate_member_count, direction: desc}, {field: tranche_id, direction: asc}]
  - question: EMEA green bonds raising money to refinance debt, priced 2025
    request:
      source: capital_markets_tranche
      # ONE request: region, ESG label, purpose and tenor are all on this
      # object. This used to cost a hop to the deal object for the region and
      # the use of proceeds.
      metric: tranche_count
      dimensions: [deal_name, deal_id, tranche_name, tranche_id, tenors, esg_bond, use_of_proceeds]
      filters:
        - {field: product, op: eq, value: DCM}
        # 'bonds' is a TRANCHE noun, so the region is the TRANCHE's target
        # region. Use deal_region only when the user says '<region> DEALS' —
        # and note DCM deal_region population is unmeasured, so a deal_region
        # filter that returns 0 on DCM should be retried here.
        - {field: tranche_region, op: eq, value: EMEA}
        - {field: esg_bond, op: like, value: "%GREEN%"}
        # All three stored spellings — a two-value list misses every DCM one.
        - {field: use_of_proceeds, op: in, value: ["Refinance", "Debt Repayment", "Repay Outstanding Borrowings"]}
        - {field: pricing_date, op: gte, value: "2025-01-01"}
        - {field: pricing_date, op: lt, value: "2026-01-01"}
      order: [{field: tranche_count, direction: desc}, {field: tranche_id, direction: asc}]
  - question: Settled DCM tranches over USD 1bn maturing after 2030
    request:
      source: capital_markets_tranche
      # deal_status is on THIS object for both products — no hop, and the
      # case-insensitive filter matches both 'Settled' and any case variant.
      metric: total_tranche_size
      dimensions: [deal_name, tranche_name, tranche_id, currency, securities_maturity, deal_status]
      filters:
        - {field: product, op: eq, value: DCM}
        - {field: deal_status, op: eq, value: "Settled"}
        - {field: currency, op: eq, value: USD}
        - {field: tranche_size, op: gt, value: 1000000000}
        # securities_maturity is a real DATE now, so this is a date comparison.
        - {field: securities_maturity, op: gte, value: "2031-01-01"}
      order: [{field: total_tranche_size, direction: desc}, {field: tranche_id, direction: asc}]
      limit: 25
  - question: 10-year green bonds priced in 2025 with no tenor gaps
    request:
      source: capital_markets_tranche
      metric: tranche_count
      dimensions: [deal_name, tranche_name, tranche_id, tenors, esg_bond, coupon_type]
      filters:
        - {field: product, op: eq, value: DCM}
        - {field: esg_bond, op: like, value: "%GREEN%"}
        # Short token: '%10-Y%' matches BOTH '10-YEAR' and '10-Y'.
        # '%10-YEAR%' would return zero on every short-form row.
        # Mind the digit boundary on single-digit tenors ('%2-Y%' hits '12-Y').
        - {field: tenors, op: like, value: "%10-Y%"}
        - {field: pricing_date, op: gte, value: "2025-01-01"}
        - {field: pricing_date, op: lt, value: "2026-01-01"}
      order: [{field: tranche_count, direction: desc}, {field: tranche_id, direction: asc}]
  - question: NYSE-listed common stock tranches priced in 2025 (ECM)
    request:
      source: capital_markets_tranche
      metric: tranche_count
      dimensions: [deal_name, tranche_name, tranche_id, product_type, exchange]
      filters:
        - {field: product, op: eq, value: ECM}
        # The view stores the FULL venue name — eq 'NYSE' returns zero rows.
        - {field: exchange, op: like, value: "%NEW YORK%"}
        # Class word, not the user's phrasing — 'Common Shares' and
        # '144A Common Stock' are both matched by '%COMMON%'.
        - {field: product_type, op: like, value: "%COMMON%"}
        - {field: pricing_date, op: gte, value: "2025-01-01"}
        - {field: pricing_date, op: lt, value: "2026-01-01"}
      order: [{field: tranche_count, direction: desc}, {field: tranche_id, direction: asc}]
  - question: Which tranches have no size recorded (DCM, 2025)
    request:
      source: capital_markets_tranche
      # A size-less tranche is stored as 0, not NULL — this is the honest way to
      # answer "which deals are missing a size".
      metric: tranche_count
      dimensions: [deal_name, deal_id, tranche_name, tranche_id, currency]
      filters:
        - {field: product, op: eq, value: DCM}
        - {field: tranche_size, op: eq, value: 0}
        - {field: pricing_date, op: gte, value: "2025-01-01"}
        - {field: pricing_date, op: lt, value: "2026-01-01"}
      order: [{field: tranche_count, direction: desc}, {field: tranche_id, direction: asc}]

# ---------------------------------------------------------------------------
# GAP: this source declares NO computed_filters. The v1 single-source ontology
# had them (broker_participation / syndicate_member / bill_and_deliver /
# syndicate_role_lead); the four-view split did not carry them over. Until they
# are ported, any request naming one fails with `unknown_computed_filter`.
#
# They are worth porting: a computed filter is the ONLY place this system can
# express an OR (an alias's codes are OR-joined into one regex) and the only
# NULL-safe negation (`negate` COALESCEs a missing value to a non-matching
# sentinel, so a tranche with no B&D correctly counts as non-B&D). That single
# feature is what turns the two-step non-B&D recipe above into one request.
#
# Port them from the v1 `capital_markets.yaml` rather than re-deriving: the bank codes
# and the pattern_template anchor for pipe-delimited lists must match the data
# exactly, and a wrong regex fails silently by matching the wrong rows.
#
# OPEN, NOT ENCODED — each needs one measurement before it can become a rule:
#   * DCM population of SECTOR and of DEAL_REGION (both are wired on the DCM
#     branch of this view; whether they carry data is unmeasured).
#   * SETTLEMENT_CURRENCY population on either product.
#   * The exact agency literals inside ISSUER_RATINGS (Moody's / Moodys / …),
#     hence the "match a short stem" instruction above.
#   * DISTINCT TENOR_PERIOD — whether the canonical label is '10-YEAR' or
#     '10-Y', and how months are spelled ('M' vs 'MONTH'). Measuring it would
#     let the file name one canonical spelling; until then every recipe uses
#     the short '%10-Y%' token, which matches both. V1's dictionary documents
#     the drift ('2Y','2-Y','2M','2-M') and month periods, so do NOT collapse
#     the instruction back to '%10-YEAR%'.
#   * Whether ECM syndicate member tokens still carry an inline '(true)'/
#     '(false)' suffix from the source column; strip it on display either way.
#   * Whether MAX(EXCHANGE) is lossless across the duplicate product-detail
#     rows, i.e. whether a dual-listed tranche loses a venue.
# ---------------------------------------------------------------------------
