# ---------------------------------------------------------------------------
# Verify column names against the physical view before use.
# ---------------------------------------------------------------------------
# Governed ontology — ECM/DCM ORDER object (Oracle via Starburst/Trino).
#
# Grain: ONE row per PRODUCT + ORDER_ID. Investor demand/allocation/order facts
# live here. Deal and tranche attributes are denormalised down (deal_id,
# deal_name, tranche_id, tranche_name, pricing_date, currency) so investor asks
# stay single-object and join-free — but tranche pricing/coupon/identifiers and
# deal sizing are NOT here (use the tranche/deal objects for those).
#
# Physical source: DGSTREAM.VW_ORDER_DETAIL (UNION ALL ECM + DCM) via the
# Starburst catalog dataglobe_oraas.dgstream.
#
# ROUTING NOTE: "how many deals did <investor> buy?" is an ORDER question — it
# filters on an investor and aggregates COUNT(DISTINCT deal_id). The grain is
# orders; the metric counts deals. Keep that distinction.
# ---------------------------------------------------------------------------
source: ecm_dcm_order
version: "2"
dialect: trino

connection:
  catalog: dataglobe_oraas
  schema: dgstream
  sslmode: require

base_view: dataglobe_oraas.dgstream.vw_order_detail

grain: [product, order_id]

max_limit: 5000
query_timeout_seconds: 60

default_time_dimension: pricing_date

how_to_use:
  - "USE THIS OBJECT for order-grain asks: investors/accounts, demand, allocation,
     order/IOI type, meeting type, investor category/region, 'top investors', and
     'how many deals/tranches did <investor> touch' (COUNT DISTINCT on deal/tranche
     while filtering the investor)."
  - "ALWAYS set 'product'. ECM allocations/demand are SHARE COUNTS; DCM order
     amounts are notional MONEY — scope one 'currency' or group by 'currency' for
     DCM money totals. State the unit in the answer."
  - "Investor-side scoping: use investor_id (GP id) for a picked entity or
     investor_name like '%NAME%' for a family/name. Umbrella names (BlackRock,
     Fidelity) mean the whole family — group by investor_name and show ids."
  - "Investor region mixes full names and codes ('United States' AND 'US') plus
     typos. NEVER like '%US%' — it matches RUSSIA and AUSTRIA. Filters are ANDed,
     so an OR of two patterns is not expressible: use in ['United States','US'].
     If you suspect other spellings, spend ONE request grouping by
     investor_region to see the actual value domain, then filter with the values
     you saw. A NOT-region predicate drops null-region rows: count them with
     is_null and say how many were excluded."
  - "Metric routing: demand/indication → total_demand; allocation/'got shares' →
     total_allocation; DCM order size/amount → total_order_amount; ECM order size →
     total_allocation."
  - "COVERAGE / oversubscription = demand ÷ size. Demand is here; SIZE IS NOT ON
     THIS OBJECT — it lives on ecm_dcm_tranche (total_tranche_size). Answering
     costs two requests plus your own division; say the ratio and both inputs.
     (Denormalising TRANCHE_SIZE down onto this view would make it single-object
     and is legal at this grain — raised with the view owner, not yet available.)"
  - "VALUE TRAPS on this object: meeting_type's stored literal is '1x1', NOT
     'One-to-One'; 'other than 1x1' must exclude BOTH '1x1' and 'No Meeting', and
     the answer must say the no-meeting orders were excluded. investor_category
     is a CATEGORY, not the untracked 'classification' taxonomy — see
     unsupported_intents."

# ------------------------------- METRICS -----------------------------------
# UNITS GUARD: every metric over a per-product-unit column declares
# requires_filters: [product]. ECM allocation/demand are SHARE COUNTS and DCM
# order amounts are notional MONEY — an unguarded SUM adds shares to dollars.
# This object is where that failure actually reached a user ("1,000.0bn shares").
metrics:
  total_allocation:
    column: order_allocation
    aggregation: SUM
    numeric: true
    requires_filters: [product]
    description: >-
      Total final allocation to investors. Investor-side — pair with an investor
      filter. ECM=shares, DCM=money (scope one currency for DCM).
  max_allocation:
    column: order_allocation
    aggregation: MAX
    numeric: true
    requires_filters: [product]
    description: Largest single allocation. "Who got the most".
  average_allocation:
    column: order_allocation
    aggregation: AVG
    numeric: true
    requires_filters: [product]
    description: Average allocation across matched orders.
  total_demand:
    column: order_demand_qty
    aggregation: SUM
    numeric: true
    requires_filters: [product]
    description: >-
      Total investor demand ("the book"). ECM=shares, DCM=money. Pair with an
      investor filter for a specific account.
  max_demand:
    column: order_demand_qty
    aggregation: MAX
    numeric: true
    requires_filters: [product]
    description: Largest single investor demand/indication ("anchor order").
  total_order_amount:
    column: order_amount
    aggregation: SUM
    numeric: true
    requires_filters: [product]
    description: "DCM. Total order/indication amount placed by investors (money). Scope one currency."
  max_order_amount:
    column: order_amount
    aggregation: MAX
    numeric: true
    requires_filters: [product]
    description: "DCM. Largest single investor order amount."
  order_count:
    column: order_id
    aggregation: COUNT_DISTINCT
    description: Number of distinct investor orders.
  investor_count:
    column: investor_gp_id
    aggregation: COUNT_DISTINCT
    description: Number of distinct investors (by GP id).
  deal_count:
    column: deal_id
    aggregation: COUNT_DISTINCT
    description: >-
      Number of distinct deals touched by the matched orders. Use for "how many
      deals did <investor> buy" (filter the investor, metric deal_count).
  tranche_count:
    column: tranche_id
    aggregation: COUNT_DISTINCT
    description: Number of distinct tranches touched by the matched orders.
  row_count:
    column: order_id
    aggregation: COUNT
    description: >-
      Total matched rows. At this grain that equals order_count — prefer
      order_count in any answer shown to a user.

# ------------------------------ DIMENSIONS ---------------------------------
# NOTE: fields prefixed "ECM." are populated on ECM rows only and are NULL on
# DCM. Filtering one outside its product returns nothing — scope product first.
dimensions:
  product: {column: product, description: "Product — 'ECM' or 'DCM'."}
  deal_id: {column: deal_id, description: "Deal id (denormalised). TEXT — quote it. Project it in listings: it is the drill-down handle."}
  deal_name: {column: deal_name, description: "Deal name (display)."}
  tranche_id: {column: tranche_id, description: "Tranche id (denormalised). TEXT — quote it."}
  tranche_name: {column: tranche_name, description: "Tranche name (display). Include it whenever several tranches of one deal are listed, or the rows read as duplicates."}
  order_id: {column: order_id, description: "Unique order id — the unique key at this grain. Use it as the final sort key on every paged listing."}
  investor_name: {column: investor_name, description: "Investor/account name (display). NOT unique — several ids can share a name."}
  investor_id: {column: investor_gp_id, description: "Investor GP id (investor-side key). TEXT — quote it, leading zeros matter."}
  investor_region: {column: investor_region, description: "ECM. Investor's own geography. Mixes full names and codes ('United States' and 'US')."}
  investor_category: {column: investor_category, description: "ECM. Investor category (Long Only, Hedge Fund, Asset Manager…). This is CATEGORY — 'classification' is a different, untracked taxonomy; see unsupported_intents."}
  investor_category_key: {column: investor_category_key, description: "ECM. Coded investor category key."}
  meeting_type: {column: meeting_type, description: "ECM. Investor/issuer meeting type. The stored literal is '1x1' (not 'One-to-One'); 'No Meeting' is also a value."}
  meeting_type_key: {column: meeting_type_key, description: "ECM. Coded meeting type."}
  order_type: {column: order_type, description: "ECM. Order handling type (OTT/Regular)."}
  ioi_type: {column: ioi_type, description: "ECM. Indication-of-interest type (LIMIT/MARKET/SCALED)."}
  order_allocation: {column: order_allocation, description: "Allocation on this order (ECM shares / DCM money) — project it in order listings."}
  order_demand_qty: {column: order_demand_qty, description: "Demand on this order (ECM shares / DCM money) — project it in order listings."}
  order_amount: {column: order_amount, description: "DCM. Order/indication amount (money)."}
  currency: {column: currency, description: "Pricing currency (scalar). Required alongside any DCM money figure."}
  pricing_date: {column: pricing_ts, description: "Tranche pricing timestamp (default time field)."}

# -------------------------------- FILTERS ----------------------------------
filters:
  product:
    column: product
    operators: [eq, in]
    suggestable: true
    values: ["ECM", "DCM"]
    description: "Product scope — 'ECM' or 'DCM'. Set on every query."
  deal_id: {column: deal_id, operators: [eq, ne, in, not_in], description: "Filter by deal id (TEXT — quote it). 0 rows for a labelled id means no data for that id; never substitute a lookalike."}
  tranche_id: {column: tranche_id, operators: [eq, ne, in, not_in], description: "Filter by tranche id (TEXT — quote it)."}
  order_id: {column: order_id, operators: [eq, ne, in, not_in], description: "Filter by order id (TEXT — quote it)."}
  investor_id:
    column: investor_gp_id
    operators: [eq, ne, in, not_in]
    description: "Investor-side filter (GP id). Quote it — leading zeros matter."
  investor_name:
    column: investor_name
    operators: [like, eq, in]
    suggestable: true
    entity_name: true
    entity_id_column: investor_gp_id
    case_insensitive: true
    description: "Filter by investor/account name — like '%NAME%'. No id lookup needed."
  deal_name:
    column: deal_name
    operators: [like, eq, in]
    suggestable: true
    entity_name: true
    entity_id_column: deal_id
    case_insensitive: true
    description: "Filter by deal name — like '%NAME%'."
  investor_region:
    column: investor_region
    operators: [eq, ne, in, not_in, like, is_null, is_not_null]
    suggestable: true
    case_insensitive: true
    description: >-
      ECM. Investor geography — mixes full names and codes. USA →
      in ['United States','US']; NEVER like '%US%' (it matches RUSSIA and
      AUSTRIA). "Non-USA" is not_in on that same pair, not like '%NON%'.
      A NOT-region predicate silently drops NULL-region rows — count them with
      is_null and disclose the number. Unsure of the spellings? Group by this
      field once to see the value domain.
  investor_category:
    column: investor_category
    operators: [eq, ne, in, not_in, like, is_null, is_not_null]
    suggestable: true
    case_insensitive: true
    description: "ECM. Investor category (Long Only, Hedge Fund, Asset Manager…)."
  meeting_type:
    column: meeting_type
    operators: [eq, ne, in, not_in, like, is_null, is_not_null]
    suggestable: true
    case_insensitive: true
    description: >-
      ECM. Meeting type. The stored literal is '1x1' — 'One-to-One' matches
      NOTHING. "Other than 1x1" must exclude BOTH '1x1' AND 'No Meeting'
      (not_in ['1x1','No Meeting']), and the answer must say the no-meeting
      orders were excluded, or the count reads as if everyone met.
  order_type:
    column: order_type
    operators: [eq, ne, in, not_in, like]
    suggestable: true
    case_insensitive: true
    description: "ECM. Order handling type (OTT/Regular)."
  ioi_type:
    column: ioi_type
    operators: [like, eq, in, not_in]
    suggestable: true
    case_insensitive: true
    description: "ECM. IOI type (LIMIT/MARKET/SCALED)."
  order_allocation:
    column: order_allocation
    operators: [gt, gte, lt, lte, between, eq, is_null, is_not_null]
    description: >-
      ROW-LEVEL allocation threshold ("orders larger than 1m shares"). Distinct
      from a HAVING on total_allocation, which thresholds an investor's TOTAL.
      Pair with product — the unit differs.
  order_demand_qty:
    column: order_demand_qty
    operators: [gt, gte, lt, lte, between, eq, is_null, is_not_null]
    description: "ROW-LEVEL demand threshold. Pair with product — the unit differs."
  order_amount:
    column: order_amount
    operators: [gt, gte, lt, lte, between, eq, is_null, is_not_null]
    description: "DCM. ROW-LEVEL order-amount threshold (money). Pair with a currency scope."
  currency:
    column: currency
    operators: [eq, ne, in, not_in]
    suggestable: true
    case_insensitive: true
    description: "Pricing currency. Required for comparable DCM money totals."
  pricing_date:
    column: pricing_ts
    operators: [eq, gt, gte, lt, lte, between, is_null, is_not_null]
    description: >-
      Default time filter — pricing date/time. Trailing windows need BOTH bounds
      (gte start AND lt tomorrow-midnight) so future-dated pricings are excluded
      and today's are not.

unsupported_intents:
  matched_orders:
    patterns: ["matched orders", "orders that were matched", "show matched"]
    reason: No order match status column is exposed on the order view.
    user_message: >-
      Matched-order status isn't available here. I can filter by deal status or
      investor category instead.
  away_orders:
    patterns: ["away orders", "orders from other banks"]
    reason: No away-order flag / originating-bank attribution exists.
    user_message: >-
      Away orders (placed by other syndicate banks) aren't captured. I can show
      all orders for a deal, or filter the syndicate on the tranche object.
  investor_classification:
    patterns: ["investor classification", "classification of investors", "classify investors"]
    reason: >-
      'Classification' is a different, untracked taxonomy from investor_category.
      Its values (Strategic, Family Office, Retail, SWF, DSP, Index, Quant) do
      not appear in investor_category at all, so substituting one for the other
      returns a WRONG population, not an approximate one.
    user_message: >-
      Investor "classification" isn't tracked as a separate taxonomy. I can group
      or filter by investor_category (Long Only, Hedge Fund, Asset Manager…) —
      would that work?

usage_notes:
  - Always set a product filter. One row per order — no deduplication.
  - Investor asks scope by investor_id (picked) or investor_name like '%NAME%'.
  - DCM money totals need a single currency scope or group by currency.
  - For "how many deals did <investor> buy", filter the investor and use metric deal_count.
  - EVERY ranking or paged request ends its 'order' with a UNIQUE key (order_id
    here). investor_name is NOT unique — paging on it repeats or drops rows, and
    ties reshuffle between turns.
  - A listing request projects the row-level facts (order_id, allocation/demand);
    an aggregate request projects the group keys. "Show me the orders" is a
    listing, not a per-investor count.
  - Ids (order_id, deal_id, tranche_id, investor GP id) are TEXT — quote them and
    keep leading zeros.

examples:
  - question: Top 15 investors by allocation on ECM deals in 2024
    request:
      source: ecm_dcm_order
      metric: total_allocation
      dimensions: [investor_name, investor_id]
      filters:
        - {field: product, op: eq, value: ECM}
        - {field: pricing_date, op: gte, value: "2024-01-01"}
        - {field: pricing_date, op: lt, value: "2025-01-01"}
      order: [{field: total_allocation, direction: desc}, {field: investor_id, direction: asc}]
      limit: 15
  - question: How many deals did BlackRock buy in 2025 (ECM)
    request:
      source: ecm_dcm_order
      metric: deal_count
      dimensions: [investor_name]
      filters:
        - {field: product, op: eq, value: ECM}
        - {field: investor_name, op: like, value: "%BLACKROCK%"}
        - {field: pricing_date, op: gte, value: "2025-01-01"}
        - {field: pricing_date, op: lt, value: "2026-01-01"}
      order: [{field: deal_count, direction: desc}, {field: investor_name, direction: asc}]
  - question: Orders for a specific deal (paged listing)
    request:
      source: ecm_dcm_order
      metric: order_count
      dimensions: [order_id, investor_name, investor_id, tranche_name,
                   order_allocation, order_demand_qty, order_type, ioi_type]
      filters:
        - {field: product, op: eq, value: ECM}
        - {field: deal_id, op: eq, value: "REPLACE_WITH_DEAL_ID"}
      # Unique final sort key — without order_id the pages are unstable.
      order: [{field: investor_name, direction: asc}, {field: order_id, direction: asc}]
      limit: 50
  - question: US investors in a deal, excluding null-region orders
    request:
      source: ecm_dcm_order
      metric: total_allocation
      dimensions: [investor_name, investor_id, investor_region, investor_category]
      filters:
        - {field: product, op: eq, value: ECM}
        - {field: deal_id, op: eq, value: "REPLACE_WITH_DEAL_ID"}
        # Never like '%US%' — it matches RUSSIA and AUSTRIA.
        - {field: investor_region, op: in, value: ["United States", "US"]}
      order: [{field: total_allocation, direction: desc}, {field: investor_id, direction: asc}]
  - question: Investors who met the issuer other than 1x1 (ECM)
    request:
      source: ecm_dcm_order
      metric: order_count
      dimensions: [investor_name, investor_id, meeting_type]
      filters:
        - {field: product, op: eq, value: ECM}
        - {field: deal_id, op: eq, value: "REPLACE_WITH_DEAL_ID"}
        # Excludes BOTH the 1x1 literal and No Meeting — disclose the exclusion.
        - {field: meeting_type, op: not_in, value: ["1x1", "No Meeting"]}
      order: [{field: order_count, direction: desc}, {field: investor_id, direction: asc}]
