# ============================================================================
# LINES MARKED [VERIFY] ARE ASSUMPTIONS about the physical view. The database is
# the only authority — introspect vw_tranche_summary, correct the column names,
# then delete the markers.
# ============================================================================
# Governed ontology — ECM/DCM TRANCHE object (Oracle via Starburst/Trino).
#
# Grain: ONE row per PRODUCT + DEAL_ID + TRANCHE_ID. Tranche facts live here:
# sizing, pricing, currency, coupon/tenor/seniority (DCM), identifiers,
# syndicate and ratings. Deal attributes are denormalised DOWN (deal_name,
# issuer, sector) so tranche asks stay single-object; order/investor attributes
# are NOT here — use ecm_dcm_order.
#
# Physical source: DGSTREAM.VW_TRANCHE_SUMMARY (UNION ALL ECM + DCM) via the
# Starburst catalog dataglobe_oraas.dgstream.
#
# ROUTING NOTE: this is the ONLY object that can answer syndicate, B&D,
# identifier, coupon, tenor, rating and exchange questions. "Which deals did
# Citi bill?" is a TRANCHE question even though the user says "deals" — the
# grain is tranches; report distinct deals with the deal_count metric.
# ----------------------------------------------------------------------------
source: ecm_dcm_tranche
version: "2"
dialect: trino

connection:
  catalog: dataglobe_oraas
  schema: dgstream
  sslmode: require

base_view: dataglobe_oraas.dgstream.vw_tranche_summary        # [VERIFY]

grain: [product, deal_id, tranche_id]

max_limit: 5000
query_timeout_seconds: 60

default_time_dimension: pricing_date

how_to_use:
  - "USE THIS OBJECT for tranche-grain asks: tranche sizing, pricing date,
     currency, coupon/tenor/seniority/rating/maturity (DCM), product type and
     exchange (ECM), security identifiers, syndicate membership, roles, and
     bill-and-deliver. One row per tranche — never deduplicate."
  - "DO NOT ask this object for investor/allocation/demand attributes — use
     ecm_dcm_order. For deal-level counts and roll-ups use ecm_dcm_deal."
  - "ALWAYS set 'product'. ECM tranche sizes are SHARE COUNTS; DCM tranche sizes
     are notional MONEY — for DCM money totals scope one 'currency' or group by
     'currency'. This object is where currency-comparable DCM money lives (the
     deal object's deal_size is not currency-scoped)."
  - "ALWAYS project tranche_name (and tranche_id) when more than one tranche of a
     deal can appear — without it the rows read as duplicated deal names."
  - "MULTI-VALUE COLUMNS: syndicate_member_name, syndicate_role, broker_code and
     bnd_broker are pipe-delimited lists that are POSITION-ALIGNED with each
     other — the i-th member, i-th role and i-th flag are the same bank. NEVER
     attribute a role or a B&D flag to a bank by matching two lists separately;
     that proves both values exist somewhere, not that they belong together."
  - "BILL & DELIVER: use the resolved 'bnd_bank' dimension — it names the B&D
     bank directly. Do NOT parse the pipe lists. ('Which deals did <bank> bill?'
     → filter bnd_bank like '%BANK%', metric deal_count.)"
  - "NON-B&D is a two-part predicate: PARTICIPATED but did NOT bill. This source
     declares no computed_filters yet, so express it with real filters — filter
     syndicate_member_name like '%BANK%' (participated) and PROJECT bnd_bank,
     then split billed vs not-billed in the answer. Do NOT negate
     PARTICIPATION: on a Citi book that excludes almost every tranche, which was
     a production zero-result bug. Do NOT use bnd_bank ne/not_in either — those
     silently drop tranches with NO B&D recorded, which belong in a non-B&D
     answer. (The clean form is a governed computed_filter with negate, which is
     NULL-safe; see the note at the end of this file.)"
  - "SOLO: 'deal_sharing_type' = 'SOLO' means TRUE sole-managed on the new view
     (the old view labelled Citi-LED tranches SOLO — 25.1% of ECM tranches were
     mislabelled; fixed at source). Cross-check with syndicate_member_count = 1
     when the answer is materially about sole-management, and state the reading
     you used."
  - "IDENTIFIERS: identifier_type and identifier_value are aligned pipe lists.
     Match with 'like' and case-insensitively — DCM stores types lowercase
     ('cusip'), ECM uppercase ('CUSIP'). When displaying, ZIP the two lists by
     position into ONE cell ('CUSIP 123456789 · FIGI 12345X') and label the row
     by tranche; never split a pipe list across table columns — doing so shifts
     every later column and made DEAL_ID display an ISIN in production."
  - "DCM-only fields (coupon_type, coupon_freq, tenors, seniority, reg_category,
     esg_bond, securities_maturity, issuer_ratings, delivery_type,
     product_class, tranche_status) are NULL on ECM. ECM-only fields
     (product_type, exchange, syndicate roles) are NULL or single-valued on DCM.
     Filtering outside a field's product returns nothing — scope the product
     first."
  - "VALUE TRAPS on this object (the stored literal is never the spoken word):
     tenors are '10-YEAR' not '10Y'; coupon types use SPACES not hyphens
     ('Fixed to FRN', 'Zero Coupon', 'Step Coupon'); reg_category is
     'SEC Registered(Public)' with NO space before the bracket; exchange stores
     full venue names as well as abbreviations; product_type labels vary
     ('Common Shares' vs '144A Common Stock'). Match all of these with 'like' on
     the distinguishing token, never equality."
  - "Trailing windows need BOTH bounds (gte start AND lt tomorrow-midnight) so
     future-dated pricings are excluded and today's pricings are not."

# ------------------------------- METRICS ------------------------------------
# UNITS GUARD: every metric over a per-product-unit column declares
# requires_filters: [product] — without it, MAX/SUM compares ECM share counts
# against DCM notional money.
metrics:
  total_tranche_size:
    column: tranche_size
    aggregation: SUM
    numeric: true
    requires_filters: [product]
    description: >-
      Total tranche size. ECM=shares, DCM=notional money. For DCM, scope one
      currency or group by currency — this is the currency-comparable money
      metric that the deal object cannot provide.
  largest_tranche_size:
    column: tranche_size
    aggregation: MAX
    numeric: true
    requires_filters: [product]
    description: Largest single tranche. Use for "biggest tranche".
  smallest_tranche_size:
    column: tranche_size
    aggregation: MIN
    numeric: true
    requires_filters: [product]
    description: Smallest single tranche.
  average_tranche_size:
    column: tranche_size
    aggregation: AVG
    numeric: true
    requires_filters: [product]
    description: Average tranche size.
  tranche_count:
    column: tranche_id
    aggregation: COUNT_DISTINCT
    description: Number of distinct tranches. Use for "how many tranches".
  deal_count:
    column: deal_id
    aggregation: COUNT_DISTINCT
    description: >-
      Number of distinct deals covered by the matched tranches. Use when the
      user says "deals" but the filter is tranche-level (syndicate, B&D,
      coupon, identifier). A multi-tranche deal must NOT be counted twice.
  issuer_count:
    column: gfcid
    aggregation: COUNT_DISTINCT
    description: Number of distinct issuers.
  syndicate_member_count:
    column: syndicate_member_name
    aggregation: MAX
    list_count: true
    requires_filters: [product]
    description: >-
      ECM. Number of banks in the tranche's syndicate (counts the pipe-delimited
      list). Use with a HAVING threshold for "deals with 5+ syndicate members".
      A single-member syndicate (count = 1) is the independent test for
      sole-managed. MEANINGLESS ON DCM — that view exposes only the B&D bank, so
      the count is always 1 there; scope product to ECM before using it.
  row_count:
    column: tranche_id
    aggregation: COUNT
    description: >-
      Total matched rows. At this grain that equals tranche_count — prefer
      tranche_count in any answer shown to a user.

# ------------------------------ DIMENSIONS ----------------------------------
dimensions:
  product: {column: product, description: "Product — 'ECM' or 'DCM'."}
  # --- deal attributes denormalised down (do not multiply rows) ---
  deal_id: {column: deal_id, description: "Deal id (denormalised). TEXT — quote it. Project it in listings: it is the drill-down handle."}
  deal_name: {column: deal_name, description: "Deal name (display). NOT unique across tranches — always pair with tranche_name."}
  issuer_name: {column: issuer_name, description: "Issuer/company name (display)."}
  issuer_id: {column: gfcid, description: "Issuer GFCID. TEXT — quote it."}
  sector: {column: sector, description: "Issuer industry sector. Closed list — 'Oil & Gas' is a SEPARATE value from 'Energy'."}
  # --- tranche grain ---
  tranche_id: {column: tranche_id, description: "Unique tranche id — the unique key at this grain. Use it as the final sort key on every ranking or paged listing."}
  tranche_name: {column: tranche_name, description: "Tranche name — often a TARGET-MARKET label (UNITED STATES, EMEA, GLOBAL). 'US tranches' is a tranche_name ask, not an investor-region ask."}
  tranche_size: {column: tranche_size, description: "Tranche size (ECM shares / DCM notional money). The currency-comparable money figure for DCM."}
  pricing_date: {column: pricing_ts, description: "Tranche pricing timestamp (default time field)."}
  currency: {column: currency, description: "Pricing currency (scalar at this grain). Required alongside any DCM money figure."}
  tranche_region: {column: tranche_region, description: "Tranche target region (NAM/EMEA/APAC). This is the TRANCHE's market, not the investor's geography (that lives on ecm_dcm_order)."}
  # --- ECM-only ---
  product_type: {column: product_type, description: "ECM. Fine-grained security type ('Common Shares', '144A Common Stock', 'ADR', 'Conv. Bond'). NEVER match with equality — the values are label variants; use like on the class word. For the deal-level instrument CLASS ('common stock', 'convertible') use ecm_dcm_deal.equity_type."}
  exchange: {column: exchange, description: "ECM. Listing venue — stores FULL names ('New York Stock Exchange') and sometimes abbreviations ('NYSE'); match both tokens with like, never equality."}
  # --- syndicate (aligned pipe lists) ---
  syndicate_member_name: {column: syndicate_member_name, description: "Pipe-delimited syndicate banks, position-aligned with syndicate_role/broker_code/bnd_broker. ECM only in practice — DCM exposes just the B&D bank."}
  syndicate_role: {column: syndicate_role, description: "Pipe-delimited roles, aligned with syndicate_member_name. Display only — never attribute a role to a bank by matching lists."}
  broker_code: {column: broker_code, description: "Pipe-delimited broker codes, aligned with syndicate_member_name."}
  bnd_broker: {column: bnd_broker, description: "Pipe-delimited B&D flags, aligned with syndicate_member_name (values may carry an appended '(true)'/'(false)' token). Legacy — prefer the resolved bnd_bank."}
  bnd_bank: {column: bnd_bank, description: "RESOLVED bill-and-deliver bank (single value). Use this for ALL B&D asks."}   # [VERIFY]
  deal_sharing_type: {column: deal_sharing_type, description: "'SOLO' (true sole-managed on the new view) or 'SHARED'. Cross-check with syndicate_member_count = 1 when sole-management is the point of the question."}
  # --- identifiers (aligned pipe lists) ---
  identifier_type: {column: identifier_type, description: "Pipe-delimited identifier types (CUSIP/ISIN/FIGI…), aligned with identifier_value. Casing differs per product (DCM lowercase, ECM uppercase)."}
  identifier_value: {column: identifier_value, description: "Pipe-delimited identifier values, aligned with identifier_type. Display ZIPPED with the type list into one cell per tranche."}
  ticker: {column: ticker, description: "Issuer ticker symbol."}
  # --- DCM-only ---
  product_class: {column: product_class, description: "DCM. Bond class (Investment Grade, High Yield, SSA…)."}
  coupon_type: {column: coupon_type, description: "DCM. Fixed, FRN, Zero Coupon, Fixed to FRN, Step Coupon… (SPACES, not hyphens)."}
  coupon_freq: {column: coupon_freq, description: "DCM. Annual, Semi Annual, Quarterly…"}
  tenors: {column: tenors, description: "DCM. Tenor label — format is '10-YEAR' style, not '10Y'."}
  seniority: {column: seniority, description: "DCM. Senior Secured, Senior Unsecured, Subordinated…"}
  reg_category: {column: reg_category, description: "DCM. Regulatory category — stored as 'SEC Registered(Public)' (no space before the bracket), '144A', 'Reg S'… A 'delivery type SEC Registered' ask routes HERE."}
  delivery_type: {column: delivery_type, description: "DCM. Delivery type."}
  esg_bond: {column: esg_bond, description: "DCM. GREEN / SUSTAINABILITY / SOCIAL. NULL means not an ESG bond."}
  issuer_ratings: {column: issuer_ratings, description: "DCM. Agency ratings — COMMA-separated (not pipe). There is no agency column: the NOTATION identifies the agency (Moody's Aaa/Baa1 vs S&P/Fitch AAA/BBB+)."}
  securities_maturity: {column: securities_maturity, description: "DCM. Maturity date. Future maturities are normal — never treat them as invalid or filter them out."}
  tranche_status: {column: tranche_status, description: "DCM. Tranche lifecycle status. NULL on ECM — ECM status lives on ecm_dcm_deal.deal_status."}

# -------------------------------- FILTERS -----------------------------------
filters:
  product:
    column: product
    operators: [eq, in]
    suggestable: true
    values: ["ECM", "DCM"]
    description: "Product scope — 'ECM' or 'DCM'. Set on every query."
  deal_id: {column: deal_id, operators: [eq, ne, in, not_in], description: "Filter by deal id (TEXT — quote it). 0 rows for a labelled id means no data for that id; never substitute a lookalike."}
  tranche_id: {column: tranche_id, operators: [eq, ne, in, not_in], description: "Filter by tranche id (TEXT — quote it)."}
  deal_name:
    column: deal_name
    operators: [like, eq, in]
    suggestable: true
    entity_name: true
    case_insensitive: true
    description: "Filter by deal name — like '%NAME%'. No id lookup needed."
  issuer_name:
    column: issuer_name
    operators: [like, eq, in]
    suggestable: true
    entity_name: true
    case_insensitive: true
    description: "Filter by issuer/company name — like '%NAME%'. No id lookup needed."
  issuer_id: {column: gfcid, operators: [eq, ne, in, not_in], description: "Issuer-side filter (GFCID, text — quote it)."}
  tranche_name:
    column: tranche_name
    operators: [like, eq, in, not_in]
    suggestable: true
    case_insensitive: true
    description: "Tranche name — usually a target-market label. 'US tranches' → like '%UNITED STATES%'."
  tranche_size:
    column: tranche_size
    operators: [gt, gte, lt, lte, between, eq, is_null, is_not_null]
    description: "ROW-LEVEL tranche-size threshold. Pair with product, and with currency for DCM — the unit differs by product."
  currency:
    column: currency
    operators: [eq, ne, in, not_in]
    suggestable: true
    case_insensitive: true
    description: "Pricing currency. Required for comparable DCM money totals."
  tranche_region:
    column: tranche_region
    operators: [eq, ne, in, not_in, is_null, is_not_null]
    suggestable: true
    case_insensitive: true
    description: >-
      Tranche target region (NAM/EMEA/APAC). A NOT-region predicate also drops
      NULL-region rows — count them with is_null and disclose the number.
  sector:
    column: sector
    operators: [eq, ne, in, not_in, like]
    suggestable: true
    case_insensitive: true
    description: >-
      Issuer sector — a CLOSED list of stored labels. 'Oil & Gas' is NOT filed
      under 'Energy': an "energy" ask should use 'in' with every qualifying
      value, and the answer must state which ones were included.
  product_type:
    column: product_type
    operators: [like, in, not_in]
    suggestable: true
    case_insensitive: true
    description: >-
      ECM. Security type label — 'like' only; the values are variants
      ('Common Shares', '144A Common Stock', 'ADR'). Match the CLASS WORD
      ('%COMMON%', '%ADR%'), never the user's exact phrasing. For the
      deal-level instrument class use ecm_dcm_deal.equity_type.
  exchange:
    column: exchange
    operators: [like, in, not_in]
    suggestable: true
    case_insensitive: true
    description: >-
      ECM. Listing venue. The view stores the FULL venue name, so the user's
      abbreviation is NOT a stored value — eq 'NYSE' returns zero rows.
      TRANSLATE the abbreviation to the full-name token and match with 'like':
      NYSE → '%NEW YORK%'; LSE → '%LONDON%'; HKEX → '%HONG KONG%';
      TSE → '%TOKYO%'; NASDAQ → '%NASDAQ%' (same either way). Filters are
      ANDed, so two like-patterns cannot be OR-ed — pick the full-name token,
      and say which venue spelling the answer matched.
  syndicate_member_name:
    column: syndicate_member_name
    operators: [like, is_null, is_not_null]
    case_insensitive: true
    description: >-
      Pipe list — 'like %BANK%' means the bank participated somewhere in the
      syndicate. There is no not_like operator: to exclude a bank use the
      governed computed_filter syndicate_member with negate true. NEVER negate
      participation to mean "another bank led it" — on a Citi-owned book that
      excludes almost every tranche. For "participated but did not bill" see
      how_to_use.
  bnd_bank:
    column: bnd_bank
    operators: [like, eq, ne, in, not_in, is_null, is_not_null]
    case_insensitive: true
    description: >-
      RESOLVED bill-and-deliver bank. 'Which deals did Citi bill?' →
      like '%CITIGROUP%'. is_null = no B&D designated on the tranche — report
      that as "no B&D recorded", not as zero deals. NEGATION: there is no
      not_like, and 'ne' needs the exact stored name AND silently drops
      NULL-B&D rows — use the bill_and_deliver computed_filter with negate
      instead.
  syndicate_role:
    column: syndicate_role
    operators: [like]
    case_insensitive: true
    description: >-
      Pipe list of roles, aligned with the member list. Proves a role exists on
      the tranche, NOT which bank held it. Display only — never use it to
      attribute a role to a named bank.
  deal_sharing_type:
    column: deal_sharing_type
    operators: [eq, ne, in]
    suggestable: true
    values: ["SOLO", "SHARED"]
    case_insensitive: true
    description: "Sole-managed vs shared. 'SOLO' is true sole-managed on the new view; cross-check with syndicate_member_count = 1 when it matters."
  identifier_type:
    column: identifier_type
    operators: [like, is_null, is_not_null]
    case_insensitive: true
    description: "Pipe list — like '%CUSIP%'. Case differs per product (DCM lowercase, ECM uppercase), so case-insensitive matching is mandatory."
  identifier_value:
    column: identifier_value
    operators: [like, is_null, is_not_null]
    case_insensitive: true
    description: "Pipe list — like '%<id>%'. An ISIN embeds the CUSIP, so a contains match on a CUSIP finds the ISIN too."
  ticker:
    column: ticker
    operators: [eq, ne, in, not_in, like]
    case_insensitive: true
    description: "Issuer ticker."
  product_class:
    column: product_class
    operators: [eq, ne, in, not_in, like]
    suggestable: true
    case_insensitive: true
    description: "DCM. Bond class (Investment Grade, High Yield…)."
  coupon_type:
    column: coupon_type
    operators: [eq, ne, in, not_in, like]
    suggestable: true
    case_insensitive: true
    description: "DCM. Values use SPACES not hyphens: 'Fixed to FRN', 'Zero Coupon', 'Step Coupon'. Match with like on the distinguishing word."
  coupon_freq:
    column: coupon_freq
    operators: [eq, ne, in, not_in, like]
    suggestable: true
    case_insensitive: true
    description: "DCM. Annual, Semi Annual, Quarterly, Monthly, At Maturity… (spaces, not hyphens)."
  tenors:
    column: tenors
    operators: [like, eq, in]
    case_insensitive: true
    description: "DCM. Format is '10-YEAR', not '10Y' — match with like ('%10-YEAR%')."
  seniority:
    column: seniority
    operators: [eq, ne, in, not_in, like]
    suggestable: true
    case_insensitive: true
    description: "DCM. Senior Secured, Senior Unsecured, Subordinated…"
  reg_category:
    column: reg_category
    operators: [eq, ne, in, not_in, like]
    suggestable: true
    case_insensitive: true
    description: >-
      DCM. Stored as 'SEC Registered(Public)' (NO space before the bracket),
      '144A', 'Reg S'… Match with like ('%SEC REGISTERED%'). A 'delivery type
      SEC Registered' ask belongs here, not on delivery_type.
  delivery_type:
    column: delivery_type
    operators: [eq, ne, in, not_in, like]
    suggestable: true
    case_insensitive: true
    description: "DCM. Delivery type. Note that 'SEC Registered' is a REG_CATEGORY value, not a delivery type."
  esg_bond:
    column: esg_bond
    operators: [eq, ne, in, not_in, like, is_null, is_not_null]
    suggestable: true
    case_insensitive: true
    description: "DCM. GREEN / SUSTAINABILITY / SOCIAL. is_not_null = 'ESG bonds' as a whole."
  issuer_ratings:
    column: issuer_ratings
    operators: [like, is_null, is_not_null]
    case_insensitive: true
    description: >-
      DCM. Comma-separated ratings. There is NO agency column — the notation
      identifies the agency (Moody's 'Aaa'/'Baa1'; S&P/Fitch 'AAA'/'BBB+'), so a
      Moody's ask must use Moody's notation. Rating-agency NAMES are never
      entities — never resolve them.
  securities_maturity:
    column: securities_maturity
    operators: [eq, gt, gte, lt, lte, between, is_null, is_not_null]
    description: "DCM. Maturity date. Future maturities are normal — never treat them as invalid."
  tranche_status:
    column: tranche_status
    operators: [eq, ne, in, not_in, is_null, is_not_null]
    suggestable: true
    case_insensitive: true
    description: "DCM only — NULL on ECM. For ECM lifecycle status use ecm_dcm_deal.deal_status."
  pricing_date:
    column: pricing_ts
    operators: [eq, gt, gte, lt, lte, between, is_null, is_not_null]
    description: "Tranche pricing timestamp. Trailing windows need both bounds (gte start, lt tomorrow-midnight)."

unsupported_intents:
  syndicate_on_dcm:
    patterns: ["syndicate members on the bond", "co-managers", "bookrunners for the DCM deal", "how many banks"]
    reason: >-
      On DCM the view exposes a single member — the B&D bank — not the full
      syndicate, so member counts and role questions are ECM-only.
    user_message: >-
      For DCM I can only see the bill-and-deliver bank, not the rest of the
      syndicate. I can show that, or answer the same question for ECM deals.
  role_attribution:
    patterns: ["who was the bookrunner", "which bank was lead on", "what role did citi have"]
    reason: >-
      syndicate_role is a pipe list aligned by position with the member list;
      the compiler cannot match a role to a named bank, and doing it by
      independent contains-matching produces false attributions.
    user_message: >-
      I can show the full syndicate and the list of roles on the tranche, but I
      can't reliably say which bank held which role. Want the tranche's members
      and roles side by side?
  hedge_securities_count:
    patterns: ["hedge securities", "more than one hedge security"]
    reason: No hedge-security column is exposed.
    user_message: >-
      Hedge-security counts aren't tracked. I can show the tranche's security
      identifiers or product type instead.
  selling_restrictions:
    patterns: ["selling restriction", "restricted in", "can it be sold in"]
    reason: No selling-restriction column is exposed.
    user_message: >-
      Selling restrictions by country aren't captured. Regulatory category
      (144A / Reg S / SEC Registered) is the closest available field.
  pricing_economics:
    patterns: ["fees", "spread to benchmark", "gross spread", "underwriting fee"]
    reason: No fee or spread economics are exposed on this view.
    user_message: >-
      Fee and spread economics aren't available here. I can show tranche sizes,
      coupons and tenors.

usage_notes:
  - Always set a product filter. One row per tranche — no deduplication.
  - DCM money totals need a single currency scope or group by currency; this is
    the object that makes DCM money comparable.
  - Pipe lists are position-aligned; never attribute a role or flag to a bank by
    matching two lists. Use bnd_bank for B&D.
  - Identifier and syndicate lists are displayed ZIPPED into one cell per
    tranche, never split across columns.
  - Always project tranche_name alongside deal_name so multi-tranche deals do
    not read as duplicate rows.
  - EVERY ranking or paged request ends its 'order' with a UNIQUE key
    (tranche_id here). deal_name and tranche_name are not unique.
  - ECM-only fields (product_type, exchange, full syndicate) are NULL or
    single-valued on DCM; DCM-only fields (coupon, tenor, seniority, ratings,
    ESG, maturity, tranche_status) are NULL on ECM.
  - Trailing windows need BOTH bounds (gte start AND lt tomorrow-midnight).
  - Ids (deal_id, tranche_id, gfcid) are TEXT — quote them and keep leading zeros.

examples:
  - question: Security identifiers for a deal, per tranche
    request:
      source: ecm_dcm_tranche
      metric: tranche_count
      dimensions: [tranche_name, tranche_id, identifier_type, identifier_value, ticker]
      filters:
        - {field: product, op: eq, value: ECM}
        - {field: deal_id, op: eq, value: "REPLACE_WITH_DEAL_ID"}
      order: [{field: tranche_id, direction: asc}]
      # Display: zip identifier_type with identifier_value by position into ONE
      # cell per tranche ("CUSIP 123456789 · ISIN US1234567890").
  - question: Which deals did Citi bill and deliver in 2024 (ECM)
    request:
      source: ecm_dcm_tranche
      metric: deal_count
      dimensions: [deal_name, deal_id, bnd_bank]
      filters:
        - {field: product, op: eq, value: ECM}
        - {field: bnd_bank, op: like, value: "%CITIGROUP%"}
        - {field: pricing_date, op: gte, value: "2024-01-01"}
        - {field: pricing_date, op: lt, value: "2025-01-01"}
      order: [{field: deal_count, direction: desc}, {field: deal_id, direction: asc}]
  - question: Citi non-B&D deals in 2024 (participated but did not bill, ECM)
    request:
      source: ecm_dcm_tranche
      metric: deal_count
      # Project bnd_bank so the billed/not-billed split can be made in the
      # answer. No computed_filters are declared on this source, and negating
      # bnd_bank with ne/not_in would drop tranches with NO B&D recorded — which
      # belong in a non-B&D answer.
      dimensions: [deal_name, deal_id, bnd_bank]
      filters:
        - {field: product, op: eq, value: ECM}
        # Participated. NEVER negate this to mean "someone else led".
        - {field: syndicate_member_name, op: like, value: "%CITIGROUP%"}
        - {field: pricing_date, op: gte, value: "2024-01-01"}
        - {field: pricing_date, op: lt, value: "2025-01-01"}
      order: [{field: deal_count, direction: desc}, {field: deal_id, direction: asc}]
  - question: Top 10 DCM tranches by size in USD, 2025
    request:
      source: ecm_dcm_tranche
      metric: total_tranche_size
      dimensions: [deal_name, tranche_name, tranche_id, currency]
      filters:
        - {field: product, op: eq, value: DCM}
        - {field: currency, op: eq, value: USD}
        - {field: pricing_date, op: gte, value: "2025-01-01"}
        - {field: pricing_date, op: lt, value: "2026-01-01"}
      order: [{field: total_tranche_size, direction: desc}, {field: tranche_id, direction: asc}]
      limit: 10
  - question: Deals with five or more syndicate members (ECM, 2025)
    request:
      source: ecm_dcm_tranche
      metric: syndicate_member_count
      dimensions: [deal_name, deal_id, tranche_name, tranche_id]
      filters:
        - {field: product, op: eq, value: ECM}
        - {field: pricing_date, op: gte, value: "2025-01-01"}
        - {field: pricing_date, op: lt, value: "2026-01-01"}
      having: [{metric: syndicate_member_count, op: gte, value: 5}]
      order: [{field: syndicate_member_count, direction: desc}, {field: tranche_id, direction: asc}]
  - question: Green bonds priced in 2025 with 10-year tenor
    request:
      source: ecm_dcm_tranche
      metric: tranche_count
      dimensions: [deal_name, tranche_name, tranche_id, tenors, esg_bond, coupon_type]
      filters:
        - {field: product, op: eq, value: DCM}
        - {field: esg_bond, op: like, value: "%GREEN%"}
        # '10-YEAR', never '10Y'.
        - {field: tenors, op: like, value: "%10-YEAR%"}
        - {field: pricing_date, op: gte, value: "2025-01-01"}
        - {field: pricing_date, op: lt, value: "2026-01-01"}
      order: [{field: tranche_count, direction: desc}, {field: tranche_id, direction: asc}]
  - question: NYSE-listed common stock tranches priced in 2025 (ECM)
    request:
      source: ecm_dcm_tranche
      metric: tranche_count
      dimensions: [deal_name, tranche_name, tranche_id, product_type, exchange]
      filters:
        - {field: product, op: eq, value: ECM}
        # The view stores the FULL venue name — eq 'NYSE' returns zero rows.
        - {field: exchange, op: like, value: "%NEW YORK%"}
        # Class word, not the user's phrasing — 'Common Shares' and
        # '144A Common Stock' are both matched by '%COMMON%'.
        - {field: product_type, op: like, value: "%COMMON%"}
        - {field: pricing_date, op: gte, value: "2025-01-01"}
        - {field: pricing_date, op: lt, value: "2026-01-01"}
      order: [{field: tranche_count, direction: desc}, {field: tranche_id, direction: asc}]

# ---------------------------------------------------------------------------
# GAP: this source declares NO computed_filters. The v1 single-source ontology
# had them (broker_participation / syndicate_member / bill_and_deliver /
# syndicate_role_lead); the four-view split did not carry them over. Until they
# are ported, any request naming one fails with `unknown_computed_filter`.
#
# They are worth porting: a computed filter is the ONLY place this system can
# express an OR (an alias's codes are OR-joined into one regex) and the only
# NULL-safe negation (`negate` COALESCEs a missing value to a non-matching
# sentinel, so a tranche with no B&D correctly counts as non-B&D).
#
# Port them from the v1 `ecm_dcm.yaml` rather than re-deriving: the bank codes
# and the pattern_template anchor for pipe-delimited lists must match the data
# exactly, and a wrong regex fails silently by matching the wrong rows.
# ---------------------------------------------------------------------------
