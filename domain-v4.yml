# domain.yaml v2 — ecm_dcm
# Slimmed per token audit: every key and DOMAIN_* variable NAME is preserved
# (template rendering safe); conversation-layer content moved to the
# text2sql-ecm-dcm skill (always in the agent's context alongside this
# rendered config); each SQL rule stated once. Server-side sections
# (entity_search templates, mappings, event_messages, presentation) unchanged.

domain:
  name: ecm_dcm
  assistant_name: ECM/DCM Deal Analysis Assistant
  db_type: oracle
  db_type_env: ECM_DCM_DB_TYPE

# -- Schema & validation ------------------------------------------------
schema:
  data_dictionary: schema/vw_deal_order_summary.json
  validation_rules: schema/sql_validation_rules.yaml

# -- Prompts ------------------------------------------------------------
prompts:
  text_to_sql: generic_text_to_sql_query
  summary_base: generic_data_summary
  variable_files:
    DOMAIN_BROKER_ALIASES_JSON:
      path: criteria/broker_aliases.json
      format: json
    DOMAIN_CONVERSATIONAL_FOLLOWUP_EXAMPLES_JSON:
      path: criteria/conversational_followup_examples.json
      format: json
    DOMAIN_FUZZY_MATCH_SCENARIOS_JSON:
      path: criteria/fuzzy_match_scenarios.json
      format: json
    DOMAIN_COLUMN_INTENT_MAP_JSON:
      path: criteria/column_intent_map.json
      format: json
    DOMAIN_COLUMN_PRIORITY_RULES_JSON:
      path: criteria/column_priority_rules.json
      format: json
    DOMAIN_FAST_PATH_INTENTS_JSON:
      path: criteria/fast_path_intents.json
      format: json
    DOMAIN_UNSUPPORTED_INTENTS_JSON:
      path: criteria/unsupported_intents.json
      format: json
  variables:
    DOMAIN_NAME: "ECM/DCM (Capital Markets)"
    DOMAIN_DESCRIPTION: >-
      deal orderbook data including deals, tranches, investors,
      allocations, and order details for Equity Capital Markets (ECM)
      and Debt Capital Markets (DCM)
    DOMAIN_VIEW_BUILD_NOTES: |
      Branch semantics for DGSTREAM.VW_DEAL_ORDER_SUMMARY (critical):
      - DCM: SYNDICATE_MEMBER_NAME = single BD_BANK string (IS the B&D bank);
        BROKER_CODE = NULL; SYNDICATE_ROLE = NULL; BND_BROKER = scalar boolean-like.
      - ECM: BROKER_CODE / BND_BROKER / SYNDICATE_ROLE / SYNDICATE_MEMBER_NAME are
        LISTAGG lists delimited by ' | ' (SPACE-PIPE-SPACE). Token anchor:
        '(^| \| )' — never '(^|\|)'. SYNDICATE_MEMBER_NAME tokens render as
        "name (true/false)"; the (true) flag marks the B&D bank.
      - Broker/role/solo logic is branch-aware, never one-size-fits-all.
      - TRANCHE_SIZE is stored as TEXT: wrap in
        TO_NUMBER(TRANCHE_SIZE DEFAULT NULL ON CONVERSION ERROR) before
        comparing, ranking, or summing.
    DOMAIN_KEY_IDENTIFIERS: "'DEAL_ID', 'DEAL_NAME', 'INVESTOR_NAME', 'GPNUM', 'ISSUER_NAME', 'GFCID', 'TRANCHE_NAME', 'SECTOR', 'OFFERING_TYPE'"
    DOMAIN_PRIMARY_IDENTIFIER: DEAL_ID
    DOMAIN_LEVEL_IDENTIFIER: DEAL_ID
    DOMAIN_DB_DIALECT: Oracle
    # Runtime entitlement values are injected by the preflight hook.
    DOMAIN_ENTITLED_PRODUCTS: "ECM, DCM"
    DOMAIN_PRODUCT_ENTITLEMENT_CLAUSE: "PRODUCT IN ('ECM', 'DCM')"
    DOMAIN_BROKER_ALIAS_HINTS: |
      Full alias map, role phrase mappings, and B&D TRUE tokens:
      DOMAIN_BROKER_ALIASES_JSON. Citi codes: CITIUSA, CITIAUS,
      CITIASIA, CITIUKE, CITGMCA. Broker/B&D/role intents never trigger
      entity_search; "non-/not-B&D" is a filter modifier, not an entity name.
    DOMAIN_CONVERSATION_MODE: |
      Multi-turn assistant. Conversation rules live in the agent's ECM/DCM
      skill. Carry confirmed filters/entities/time windows forward each turn
      unless the user overrides them.
    DOMAIN_CONVERSATION_MEMORY_SLOTS: |
      Maintain across turns: product_scope | entity_focus | selected_ids
      (GPNUM/GFCID/DEAL_ID/TRANCHE_ID/ORDER_ID) | time_window | business_grain
      | metric_intent | sort_and_limit | fuzzy_resolved_entity
      {name, id, type, status active|rejected}.
    DOMAIN_CONVERSATION_TURN_POLICY: |
      See the agent's ECM/DCM skill (conversation section). Non-negotiables:
      resolve elliptical follow-ups from prior context; on product flip
      re-derive product-dependent columns (order size: ECM=ALLOCATION,
      DCM=AMT) and short-circuit ECM-only filters instead of running empty
      queries; at most one blocking clarification per turn; never re-ask a
      resolved disambiguation; pending clarification + unrelated new ask ->
      confirm switch before any tool call.
    DOMAIN_CLARIFICATION_STYLE: |
      Short, decision-oriented, numbered options, tell the user exactly how
      to answer (e.g. "Reply with GPNUM 12345" or the option number).
    DOMAIN_FUZZY_MATCH_CONTINUATION_POLICY: |
      Explicit-identifier guard (HIGHEST PRIORITY): an explicit DEAL_ID/GPNUM/
      GFCID/TRANCHE_ID/ORDER_ID with no rows -> report "No data found for
      <ID>" and stop; NEVER substitute a closest match. Fuzzy applies to
      free-text NAMES only: use the fuzzy-matched ID immediately, answer,
      state the substitution, keep it on later turns until the user rejects
      it or names a new entity. Never stop dead at a fuzzy hint.
    DOMAIN_RESPONSE_STYLE: |
      Answer first (1-3 sentences), then a markdown table including ids,
      then 2-3 grounded follow-ups. Never narrate tools or pipeline steps.
      CONFIDENTIAL: never disclose the database/view/table names, column names,
      data types, the schema, or the generated SQL, even on direct request.
      Meta/schema/SQL requests -> brief polite decline, no tool calls; answer
      business questions only. Follow-up suggestions must be answerable:
      only entitled products (DOMAIN_ENTITLED_PRODUCTS) and never
      unsupported intents — do not suggest what the user cannot get.
    DOMAIN_COLUMN_CRITERIA_POLICY: |
      Map user criteria to columns via DOMAIN_COLUMN_INTENT_MAP_JSON; resolve
      competing columns via DOMAIN_COLUMN_PRIORITY_RULES_JSON (ask only if
      material ambiguity remains). Multiple conditions AND by default. Coded fields: UPPER(col)=UPPER(closest known literal); a plausible but
      unlisted value -> try LIKE (value lists may be incomplete). Free text -> LIKE. Always explicit
      PRODUCT + date predicates.
    DOMAIN_UNSUPPORTED_INTENTS: |
      Patterns and user replies: DOMAIN_UNSUPPORTED_INTENTS_JSON. Scan the
      WHOLE ask; acknowledge ALL unsupported aspects in one reply and still
      answer any supported part. No SQL or entity_search for the unsupported
      part. (DEAL_STATUS cancelled/deleted at DEAL level IS supported.)
    DOMAIN_FAST_PATH_ROUTING_POLICY: |
      Before any tool call: 1) unsupported -> reply per JSON, no tools for
      that part. 2) fast-path match (DOMAIN_FAST_PATH_INTENTS_JSON) with no
      named entity -> skip entity_search/fuzzy entirely: query_context -> executor
      (server-side validation; fix-once on error). 3) named investor/issuer/deal -> entity_search
      once per name (non-terminal), then continue. Broker/syndicate/rating
      asks and taxonomy/top-N asks with no named entity NEVER call
      entity_search. Metric defaults, sector/region normalizations:
      DOMAIN_COLUMN_INTENT_MAP_JSON + the agent's skill.
    DOMAIN_FOLLOW_UP_POLICY: |
      Clarify only for multiple GPNUM/GFCID matches or genuine ambiguity;
      never for broker/syndicate intents. Format per
      DOMAIN_CLARIFICATION_STYLE. One confident match (exact or fuzzy) ->
      proceed directly. After answering: 2-3 next steps, no disclaimers.
    DOMAIN_EXECUTION_STRATEGY: |
      0) entity_search is NON-terminal: on resolved ID follow the response's
         next_action to query_context (pass gfcid/gpnum/filter_criteria as
         parameters) in the SAME turn. Do not stop at resolution output.
      1) Budget (hard cap): go straight to the executor — it validates
         server-side. On a validation error fix once and re-execute: max 2
         executor attempts and 2 SQL regenerations per turn (validate_sql is
         optional). Stop after the first non-empty result; follow-ups reuse
         the conversation's existing schema_context.
      2) Zero rows -> one targeted refinement suggestion, then wait. No
         chained executor calls. Exception: a DEFAULT recency window you
         applied yourself may be widened once in the same turn.
      2b) Scan guard: no time/entity/taxonomy bound in the ask -> apply the
         default window (PRICING_TS >= ADD_MONTHS(SYSDATE,-12)) and say so;
         truly unbounded dumps ("all deals") -> ask once for product/time; 
         explicit user-confirmed full scans run WITH a FETCH FIRST cap.
      3) Top-N on flattened rows: dedupe at business grain (DEAL_ID or
         DEAL_ID+TRANCHE_ID) FIRST, then ORDER BY <metric> DESC,
         PRICING_TS DESC, DEAL_ID. EVERY listing (not just top-N) carries a
         deterministic ORDER BY (default PRICING_TS DESC, DEAL_ID,
         TRANCHE_ID). Column-add follow-ups keep the prior SQL identical
         except the SELECT list, so rows and order match the prior answer.
         Paging follow-ups ("next 20") re-run the SAME SQL + OFFSET n ROWS
         FETCH NEXT 20 ROWS ONLY (stable because ORDER BY is deterministic).
         Truncated displays ALWAYS carry the banner "Showing N of M — display
         capped at 20"; offer filter/aggregate/page as next steps (no export in MVP). Deal size = DEAL_SIZE column (never
         SUM(TRANCHE_SIZE)); book size (total demand) = SUM(DEMAND_QTY) at
         DEAL_ID grain; tranche/issue size = TO_NUMBER(TRANCHE_SIZE ...).
      4) B&D/billed asks: SQL must include BROKER_CODE or
         SYNDICATE_MEMBER_NAME context; never BND_BROKER-only filters.
      5) "with security identifiers" -> include IDENTIFIER_TYPE,
         IDENTIFIER_VALUE (+ TICKER) in output.
    DOMAIN_IDENTIFIER_TYPES_AND_PATTERNS: |
      Investor-side intent (allocation/demand/orders/top investors/accounts)
      -> GPNUM. Issuer-side intent (issued by/raised/company deals) -> GFCID.
      Never substitute one for the other; both present -> both filters. Once
      an ID is resolved, drop name LIKEs from SQL.
      Routing: explicit labeled DEAL_ID -> WHERE DEAL_ID = value directly;
      deal NAME (including names ending in a bare number) ->
      entity_search(deal_name) with the FULL name string; investor name ->
      entity_search(investor_name) -> GPNUM; issuer name ->
      entity_search(issuer_name) -> GFCID; TRANCHE_ID/ORDER_ID -> direct
      WHERE (both products carry ORDER_ID). Broker/syndicate intent -> no entity_search.
      Multiple GPNUM/GFCID matches -> stop and list numbered options.
      Years/quarters <= current date are retrieval, never "future".
    DOMAIN_MANDATORY_FILTERS: |
      A. PRODUCT: explicit filter in every query, within the ENTITLED
         products from this config. Any entitled product is available on any
         turn — never infer a narrower "current view" from session history,
         and never claim missing access unless a tool returned
         permission_denied. Product-specific asks auto-imply their product
         (coupon/tenor/seniority -> DCM; IPO/equity type/PRODUCT_TYPE
         labels -> ECM: EQUITY_TYPE and PRODUCT_TYPE are NULL on DCM rows).
         USE_OF_PROCEEDS phrases (repay/refinance/M&A/capex) imply NO
         product - both products raise for all purposes; never narrow
         PRODUCT from a UOP word.
      B. De-duplication (REQUIRED — view is flattened): deal-level asks
         dedupe by DEAL_ID; tranche-level by DEAL_ID+TRANCHE_ID; then
         aggregate/rank/limit. Order grain: ORDER_ID (BOTH products
         carry it; fallback for NULL ECM ids: DEAL_ID+INVESTOR_NAME).
      B2. The SELECT column list IS the dedupe grain (biggest duplicate-row
         trap): SELECT DISTINCT only collapses rows identical across the LISTED
         columns, so any column finer than the ask re-introduces duplicates.
         DEAL listing -> only deal-level columns (no tranche/order columns);
         TRANCHE listing -> add tranche columns, still no order/investor
         columns; order/investor columns (ORDER_ID, ORDER_TYPE, IOI_TYPE,
         GPNUM, INVESTOR_NAME, AMT, ALLOCATION, DEMAND_QTY) belong only in an
         order-level query. Never list order columns in a deal/tranche listing.
         PRICING_TS, CURRENCY, TRANCHE_SIZE, coupon/tenor vary PER
         TRANCHE: a DEAL listing is ONE ROW PER DEAL - GROUP BY DEAL_ID,
         DEAL_NAME with MIN(PRICING_TS) AS FIRST_PRICED, COUNT(DISTINCT
         TRANCHE_ID) AS TRANCHE_COUNT, SUM(TO_NUMBER(TRANCHE_SIZE DEFAULT
         NULL ON CONVERSION ERROR)) - or drop those columns entirely.
         Per-tranche rows are allowed ONLY when TRANCHE_ID/TRANCHE_NAME are
         selected (an explicit tranche listing). Row count must equal deal
         count when the user asked for deals. Date windows are half-open (>= start AND < end).
      C. Investor: SPECIFIC entity (user picked / gave id) -> WHERE
         GPNUM=value. Bare FAMILY name in a metric ask (blackrock,
         fidelity...) -> UPPER(INVESTOR_NAME) LIKE '%STEM%' aggregated
         per deal; state the family scope. Issuer -> WHERE GFCID=value.
      D. Time: sargable PRICING_TS ranges only (no TO_CHAR/EXTRACT/TRUNC in
         WHERE). Year: >= DATE 'YYYY-01-01' AND < DATE 'YYYY+1-01-01'.
         Last 12 months: ADD_MONTHS(SYSDATE,-12). Week: closed window
         >= TRUNC(ref,'IW') AND < TRUNC(ref,'IW')+7. To-now windows
         ("past N days", "last 12 months") take upper bound
         AND PRICING_TS < TRUNC(SYSDATE) + 1 — tomorrow-midnight: includes
         ALL of today's rows AND excludes FUTURE-dated rows (test data
         carries future PRICING_TS; a 2028 pricing is not "last 12
         months"). Never midnight-today (drops today), never unbounded
         (admits the future). "New deals" =
         recent PRICING_TS OR (PRICING_TS IS NULL AND active DEAL_STATUS);
         no creation-date column exists.
      E0. Investor geography IS supported via INVESTOR_REGION (values like
         'United States','Germany','EU'); "US investors" -> (UPPER(INVESTOR_REGION) LIKE '%UNITED STATES%'
         OR UPPER(INVESTOR_REGION) = 'US') - BOTH forms are stored; the code
         needs EQUALITY (never LIKE '%US%'). "NON-USA" -> UPPER(...)
         NOT LIKE '%UNITED STATES%' AND UPPER(...) <> 'US' (negation
         predicate - 'Non USA' is not a value); NOT-predicates drop NULL
         regions - report the excluded no-region count (unknown != non-USA).
         Region vocab MIXES names and codes (US/UK/JP/EU/AP/LA + typo
         variants CEEMEA/CEEMA, 'Columbia' for Colombia) - match name LIKE
         OR code equality; display codes expanded (AP -> Asia Pacific). Keep it DISTINCT from the deal's region.
         IOI type (LIMIT/MARKET/SCALED) -> IOI_TYPE; order handling
         -> ORDER_TYPE (ECM ONLY - NULL on DCM; confirmed values: 'OTT',
         'Regular'; UPPER compare). OTT/order-handling asks are ECM asks.
      E. Region: TRANCHE_REGION default (NAM/EMEA/APAC) for tranches,
         orders, bare region mentions. When the region word attaches to
         DEALS ("EMEA deals", "European deals") -> DEAL_REGION - but
         DEAL_REGION is ECM-ONLY (NULL on DCM): DCM branch keeps
         TRANCHE_REGION; REGION duplicates
         TRANCHE_REGION (same source) — never emit REGION; use
         TRANCHE_REGION (or DEAL_REGION for explicit ECM deal-level asks).
      F. Broker/syndicate: branch-aware per DOMAIN_VIEW_BUILD_NOTES and
         DOMAIN_BROKER_ALIASES_JSON. Solo: DCM -> UPPER(DEAL_SHARING_TYPE)='SOLO' (true sole-managed:
         the view requires exactly one dealer and it is Citi). ECM ->
         DEAL_SHARING_TYPE='SOLO' means CITI-LED (view flags SOLO on ANY
         Citi lead role, syndicate size ignored); for true sole-managed
         ECM use REGEXP_COUNT(SYNDICATE_MEMBER_NAME,'\|')=0 + Citi token
         and state which reading was used. Roles = ECM only,
         REGEXP_LIKE with expanded role patterns (never the user's literal
         phrase).
      G. SQL efficiency: minimal SELECT (no SELECT *), FETCH FIRST N ROWS
         ONLY on broad listings, push PRODUCT+date+entity filters first.
      H. SQL style (Oracle): NEVER double-quote identifiers - bare UPPERCASE
         names only. Quoting the dotted view name ("DGSTREAM.VW_DEAL...")
         makes it ONE invalid identifier -> ORA-00942. Date literals ALWAYS
         carry the DATE keyword (DATE 'YYYY-MM-DD'), never a bare string.
    DOMAIN_QUERY_LIBRARY: |
      PRE-VERIFIED QUERIES - when the ask matches one, COPY IT VERBATIM and
      substitute ONLY the <YEAR>/<YEAR+1>/<STATUS>/<DEAL_ID> placeholders
      (ids stay QUOTED). Do NOT compose these from scratch. Queries are the
      ECM branch; DCM adaptation: B&D = SYNDICATE_MEMBER_NAME itself (single
      member IS the B&D bank); entitlement prunes branches as always.
      -- L1 Citi B&D deals/tranches in <YEAR>
      SELECT DISTINCT DEAL_ID, DEAL_NAME, TRANCHE_ID, TRANCHE_NAME, PRICING_TS, TO_NUMBER(TRANCHE_SIZE DEFAULT NULL ON CONVERSION ERROR) AS TRANCHE_SIZE FROM DGSTREAM.VW_DEAL_ORDER_SUMMARY WHERE PRODUCT = 'ECM' AND PRICING_TS >= DATE '<YEAR>-01-01' AND PRICING_TS < DATE '<YEAR+1>-01-01' AND INSTR(BND_BROKER,'true') > 0 AND UPPER(TRIM(REGEXP_SUBSTR(SYNDICATE_MEMBER_NAME,'[^|]+',1,REGEXP_COUNT(SUBSTR(BND_BROKER,1,INSTR(BND_BROKER,'true')),'\|')+1))) LIKE '%CITIGROUP GLOBAL MARKETS%' ORDER BY PRICING_TS DESC, DEAL_ID, TRANCHE_ID FETCH FIRST 20 ROWS ONLY
      -- L2 Citi NON-B&D (participated, not billing) in <YEAR>
      SELECT DISTINCT DEAL_ID, DEAL_NAME, TRANCHE_ID, TRANCHE_NAME, PRICING_TS, TRIM(REGEXP_SUBSTR(SYNDICATE_MEMBER_NAME,'[^|]+',1,REGEXP_COUNT(SUBSTR(BND_BROKER,1,INSTR(BND_BROKER,'true')),'\|')+1)) AS BD_BANK FROM DGSTREAM.VW_DEAL_ORDER_SUMMARY WHERE PRODUCT = 'ECM' AND PRICING_TS >= DATE '<YEAR>-01-01' AND PRICING_TS < DATE '<YEAR+1>-01-01' AND UPPER(SYNDICATE_MEMBER_NAME) LIKE '%CITIGROUP GLOBAL MARKETS%' AND (INSTR(BND_BROKER,'true') = 0 OR UPPER(TRIM(REGEXP_SUBSTR(SYNDICATE_MEMBER_NAME,'[^|]+',1,REGEXP_COUNT(SUBSTR(BND_BROKER,1,INSTR(BND_BROKER,'true')),'\|')+1))) NOT LIKE '%CITI%') ORDER BY PRICING_TS DESC, DEAL_ID, TRANCHE_ID FETCH FIRST 20 ROWS ONLY
      -- L3 billed by NON-Citi (any other bank) in <YEAR>
      SELECT DISTINCT DEAL_ID, DEAL_NAME, TRANCHE_ID, TRANCHE_NAME, PRICING_TS, TRIM(REGEXP_SUBSTR(SYNDICATE_MEMBER_NAME,'[^|]+',1,REGEXP_COUNT(SUBSTR(BND_BROKER,1,INSTR(BND_BROKER,'true')),'\|')+1)) AS BD_BANK FROM DGSTREAM.VW_DEAL_ORDER_SUMMARY WHERE PRODUCT = 'ECM' AND PRICING_TS >= DATE '<YEAR>-01-01' AND PRICING_TS < DATE '<YEAR+1>-01-01' AND INSTR(BND_BROKER,'true') > 0 AND UPPER(TRIM(REGEXP_SUBSTR(SYNDICATE_MEMBER_NAME,'[^|]+',1,REGEXP_COUNT(SUBSTR(BND_BROKER,1,INSTR(BND_BROKER,'true')),'\|')+1))) NOT LIKE '%CITI%' ORDER BY PRICING_TS DESC, DEAL_ID, TRANCHE_ID FETCH FIRST 20 ROWS ONLY
      -- L4 Citi SOLO deals/tranches in <YEAR>
      SELECT DISTINCT DEAL_ID, DEAL_NAME, TRANCHE_ID, TRANCHE_NAME, PRICING_TS FROM DGSTREAM.VW_DEAL_ORDER_SUMMARY WHERE PRODUCT = 'ECM' AND PRICING_TS >= DATE '<YEAR>-01-01' AND PRICING_TS < DATE '<YEAR+1>-01-01' AND UPPER(DEAL_SHARING_TYPE) = 'SOLO' ORDER BY PRICING_TS DESC, DEAL_ID, TRANCHE_ID FETCH FIRST 20 ROWS ONLY
      -- L5 deals in <STATUS> state in <YEAR>
      SELECT DISTINCT DEAL_ID, DEAL_NAME, MAX(ISSUER_NAME) AS ISSUER_NAME, MAX(DEAL_STATUS) AS STATUS, MIN(PRICING_TS) AS FIRST_PRICED FROM DGSTREAM.VW_DEAL_ORDER_SUMMARY WHERE PRODUCT = 'ECM' AND UPPER(DEAL_STATUS) = UPPER('<STATUS>') AND PRICING_TS >= DATE '<YEAR>-01-01' AND PRICING_TS < DATE '<YEAR+1>-01-01' GROUP BY DEAL_ID, DEAL_NAME ORDER BY FIRST_PRICED DESC, DEAL_ID FETCH FIRST 20 ROWS ONLY
      -- L6 top 10 deals by tranche size in <YEAR>
      SELECT DEAL_ID, DEAL_NAME, TRANCHE_ID, TRANCHE_NAME, TO_NUMBER(TRANCHE_SIZE DEFAULT NULL ON CONVERSION ERROR) AS TRANCHE_SIZE, PRICING_TS FROM (SELECT DISTINCT DEAL_ID, DEAL_NAME, TRANCHE_ID, TRANCHE_NAME, TRANCHE_SIZE, PRICING_TS FROM DGSTREAM.VW_DEAL_ORDER_SUMMARY WHERE PRODUCT = 'ECM' AND PRICING_TS >= DATE '<YEAR>-01-01' AND PRICING_TS < DATE '<YEAR+1>-01-01') ORDER BY TO_NUMBER(TRANCHE_SIZE DEFAULT NULL ON CONVERSION ERROR) DESC NULLS LAST, PRICING_TS DESC, DEAL_ID FETCH FIRST 10 ROWS ONLY
      -- L7 all orders for deal <DEAL_ID> (page 1)
      SELECT DISTINCT ORDER_ID, INVESTOR_NAME, GPNUM, TRANCHE_NAME, ALLOCATION, DEMAND_QTY, ORDER_TYPE, IOI_TYPE, PRICING_TS FROM DGSTREAM.VW_DEAL_ORDER_SUMMARY WHERE PRODUCT = 'ECM' AND DEAL_ID = '<DEAL_ID>' ORDER BY PRICING_TS DESC, ORDER_ID FETCH FIRST 20 ROWS ONLY
      -- L8 identifiers per tranche for deal <DEAL_ID>
      SELECT DISTINCT TRANCHE_ID, TRANCHE_NAME, IDENTIFIER_TYPE, IDENTIFIER_VALUE, TICKER FROM DGSTREAM.VW_DEAL_ORDER_SUMMARY WHERE PRODUCT = 'ECM' AND DEAL_ID = '<DEAL_ID>' ORDER BY TRANCHE_ID FETCH FIRST 20 ROWS ONLY
    DOMAIN_SPECIFIC_AGGREGATION_RULES: |
      demand -> DEMAND_QTY (ECM+DCM; authoritative — overrides any stale
      mapping). allocation -> ALLOCATION. order size/amount -> ECM=ALLOCATION,
      DCM=AMT. Bare "top investors" -> SUM(ALLOCATION) ECM / SUM(AMT) DCM,
      GROUP BY GPNUM/INVESTOR_NAME, no clarification. Deal size -> DEAL_SIZE
      (dedupe DEAL_ID). Book/tranche size -> TO_NUMBER(TRANCHE_SIZE DEFAULT
      NULL ON CONVERSION ERROR). "Top N IPOs" default metric = tranche size;
      "by deal size" -> DEAL_SIZE. Result sets: ORDER BY <metric> DESC,
      PRICING_TS DESC, DEAL_ID + FETCH FIRST; include DEAL_ID, TRANCHE_ID,
      GPNUM, GFCID. Broker aggregation at deal/tranche grain after dedupe;
      no CONNECT BY LEVEL on broad windows.
      Canonical top-N dedupe shape (the ONLY shape): SELECT DISTINCT subquery
      -> ORDER BY metric DESC -> FETCH FIRST N. Never ROW_NUMBER()/window
      functions for plain top-N dedupe (whole-view sort, execution failures);
      windows only for per-group ranking / share-of-total, always bounded by
      PRODUCT + date/entity filters. NEVER self-join the view (all deal +
      tranche + order facts are already on one row); "investors in both deals"
      = GROUP BY GPNUM HAVING COUNT(DISTINCT DEAL_ID)=2.

      MONEY INTEGRITY (silent-wrong-answer traps; UNITS ARE PER PRODUCT):
      - ECM sizes/quantities are SHARES (no currency scoping needed); DCM
        sizes are notional MONEY. No FX column exists: any DCM-involving
        SUM/AVG of DEAL_SIZE / TRANCHE_SIZE / AMT must filter a single
        CURRENCY or GROUP BY CURRENCY — never total money across mixed
        currencies, and never total shares+money across both products.
      - ALLOCATION is SHARES on ECM but a MONEY amount on DCM. Never SUM it
        across PRODUCT IN ('ECM','DCM'); split with GROUP BY PRODUCT or use the
        per-product metric (ECM=ALLOCATION, DCM=AMT).

      Derived metrics (always divide with NULLIF(x,0)):
      coverage/oversubscription (NOTE: if DCM ratios compute ~1x uniformly,
      demand=allocation at source there - say the metric isn't meaningful
      for DCM) = SUM(DEMAND_QTY) / NULLIF(TO_NUMBER(
        TRANCHE_SIZE DEFAULT NULL ON CONVERSION ERROR),0) at tranche grain |
      fill/hit rate = SUM(ALLOCATION)/NULLIF(SUM(DEMAND_QTY),0) per GPNUM |
      share of book = SUM(CASE WHEN GPNUM=<x> THEN metric END) /
        NULLIF(SUM(metric),0) over deal-scoped rows (NEVER filter the investor
        in WHERE — denominator becomes 100%) | investor count = COUNT(DISTINCT GPNUM), never
        COUNT(*) | order count = COUNT(DISTINCT ORDER_ID) on both
        products (NULL-id ECM fallback: DISTINCT DEAL_ID+INVESTOR_NAME).

      Column tie-breaks: generic status ask -> DEAL_STATUS (EXECUTION_STATUS
      only when the user says "execution"); coarse security class ->
      EQUITY_TYPE, depositary/ADR/GDR/rights wording -> PRODUCT_TYPE.
      SETTLEMENT_TS in the FUTURE is valid (priced deals settle later) — never
      refuse a settlement-window ask as "future"; only future PRICING_TS is
      unknowable.

# -- Entity search (server-side SQL; unchanged from v1) ------------------
entity_search:
  mode: sql

  strategy: intent_sql
  query_templates:
    investor_name: >-
      SELECT NULL AS DEAL_ID, NULL AS DEAL_NAME, INVESTOR_NAME, GPNUM,
             NULL AS ISSUER_NAME, NULL AS GFCID, DEAL_COUNT, LAST_ACTIVE, CATEGORY, REGION, PRODUCTS
      FROM (
        SELECT INVESTOR_NAME, GPNUM, DEAL_COUNT, LAST_ACTIVE, CATEGORY, REGION, PRODUCTS,
               is_exact, is_sub,
               MAX(is_exact) OVER () AS any_exact,
               MAX(is_sub) OVER () AS any_sub
        FROM (
          SELECT INVESTOR_NAME, GPNUM,
                 COUNT(DISTINCT DEAL_ID) AS DEAL_COUNT,
                 MAX(PRICING_TS) AS LAST_ACTIVE,
                 MAX(INVESTOR_CATEGORY) AS CATEGORY,
                 MAX(INVESTOR_REGION) AS REGION,
                 CASE WHEN COUNT(DISTINCT PRODUCT) = 2 THEN 'ECM+DCM'
                      ELSE MAX(PRODUCT) END AS PRODUCTS,
                 MAX(CASE WHEN UPPER(INVESTOR_NAME) = UPPER(:entity_name)
                          THEN 1 ELSE 0 END) AS is_exact,
                 MAX(CASE WHEN UPPER(INVESTOR_NAME) LIKE UPPER(:entity_name_pattern)
                          THEN 1 ELSE 0 END) AS is_sub
          FROM DGSTREAM.VW_DEAL_ORDER_SUMMARY
          WHERE PRODUCT IN ('ECM', 'DCM')
            AND UPPER(INVESTOR_NAME) LIKE UPPER(:entity_name_pattern)
          GROUP BY INVESTOR_NAME, GPNUM
        )
      )
      WHERE is_exact = 1
         OR any_exact = 0
      ORDER BY is_exact DESC, is_sub DESC, DEAL_COUNT DESC, LAST_ACTIVE DESC
      FETCH FIRST 50 ROWS ONLY

    issuer_name: >-
      SELECT NULL AS DEAL_ID, NULL AS DEAL_NAME, NULL AS INVESTOR_NAME,
             NULL AS GPNUM, ISSUER_NAME, GFCID, DEAL_COUNT, LAST_ACTIVE, SECTOR, TICKER, PRODUCTS
      FROM (
        SELECT ISSUER_NAME, GFCID, DEAL_COUNT, LAST_ACTIVE, SECTOR, TICKER, PRODUCTS,
               is_exact, is_sub,
               MAX(is_exact) OVER () AS any_exact,
               MAX(is_sub) OVER () AS any_sub
        FROM (
          SELECT ISSUER_NAME, GFCID,
                 COUNT(DISTINCT DEAL_ID) AS DEAL_COUNT,
                 MAX(PRICING_TS) AS LAST_ACTIVE,
                 MAX(SECTOR) AS SECTOR,
                 MAX(TICKER) AS TICKER,
                 CASE WHEN COUNT(DISTINCT PRODUCT) = 2 THEN 'ECM+DCM'
                      ELSE MAX(PRODUCT) END AS PRODUCTS,
                 MAX(CASE WHEN UPPER(ISSUER_NAME) = UPPER(:entity_name)
                          THEN 1 ELSE 0 END) AS is_exact,
                 MAX(CASE WHEN UPPER(ISSUER_NAME) LIKE UPPER(:entity_name_pattern)
                          THEN 1 ELSE 0 END) AS is_sub
          FROM DGSTREAM.VW_DEAL_ORDER_SUMMARY
          WHERE PRODUCT IN ('ECM', 'DCM')
            AND UPPER(ISSUER_NAME) LIKE UPPER(:entity_name_pattern)
          GROUP BY ISSUER_NAME, GFCID
        )
      )
      WHERE is_exact = 1
         OR any_exact = 0
      ORDER BY is_exact DESC, is_sub DESC, DEAL_COUNT DESC, LAST_ACTIVE DESC
      FETCH FIRST 50 ROWS ONLY

    deal_name: >-
      SELECT DEAL_ID, DEAL_NAME, NULL AS INVESTOR_NAME, NULL AS GPNUM,
             D_ISSUER AS ISSUER_NAME, NULL AS GFCID, TRANCHE_COUNT, LAST_ACTIVE, STATUS, PRODUCTS
      FROM (
        SELECT DEAL_NAME, DEAL_ID, TRANCHE_COUNT, LAST_ACTIVE, D_ISSUER, STATUS, PRODUCTS,
               is_exact, is_sub,
               MAX(is_exact) OVER () AS any_exact,
               MAX(is_sub) OVER () AS any_sub
        FROM (
          SELECT DEAL_NAME, DEAL_ID,
                 COUNT(DISTINCT TRANCHE_ID) AS TRANCHE_COUNT,
                 MAX(PRICING_TS) AS LAST_ACTIVE,
                 MAX(ISSUER_NAME) AS D_ISSUER,
                 MAX(DEAL_STATUS) AS STATUS,
                 MAX(PRODUCT) AS PRODUCTS,
                 MAX(CASE WHEN UPPER(DEAL_NAME) = UPPER(:entity_name)
                          THEN 1 ELSE 0 END) AS is_exact,
                 MAX(CASE WHEN UPPER(DEAL_NAME) LIKE UPPER(:entity_name_pattern)
                          THEN 1 ELSE 0 END) AS is_sub
          FROM DGSTREAM.VW_DEAL_ORDER_SUMMARY
          WHERE PRODUCT IN ('ECM', 'DCM')
            AND UPPER(DEAL_NAME) LIKE UPPER(:entity_name_pattern)
          GROUP BY DEAL_NAME, DEAL_ID
        )
      )
      WHERE is_exact = 1
         OR any_exact = 0
      ORDER BY is_exact DESC, is_sub DESC, LAST_ACTIVE DESC
      FETCH FIRST 50 ROWS ONLY

    by_identifier:
      gfcid: >-
        SELECT NULL AS DEAL_ID, NULL AS DEAL_NAME, NULL AS INVESTOR_NAME,
               NULL AS GPNUM, ISSUER_NAME, GFCID,
               COUNT(DISTINCT DEAL_ID) AS DEAL_COUNT,
               MAX(PRICING_TS) AS LAST_ACTIVE
        FROM DGSTREAM.VW_DEAL_ORDER_SUMMARY
        WHERE PRODUCT IN ('ECM', 'DCM') AND GFCID = :gfcid
        GROUP BY ISSUER_NAME, GFCID
      gpnum: >-
        SELECT NULL AS DEAL_ID, NULL AS DEAL_NAME, INVESTOR_NAME, GPNUM,
               NULL AS ISSUER_NAME, NULL AS GFCID,
               COUNT(DISTINCT DEAL_ID) AS DEAL_COUNT,
               MAX(PRICING_TS) AS LAST_ACTIVE
        FROM DGSTREAM.VW_DEAL_ORDER_SUMMARY
        WHERE PRODUCT IN ('ECM', 'DCM') AND GPNUM = :gpnum
        GROUP BY INVESTOR_NAME, GPNUM
      deal_id: >-
        SELECT DEAL_ID, DEAL_NAME, NULL AS INVESTOR_NAME, NULL AS GPNUM,
               MAX(ISSUER_NAME) AS ISSUER_NAME, NULL AS GFCID,
               COUNT(DISTINCT TRANCHE_ID) AS TRANCHE_COUNT,
               MAX(PRICING_TS) AS LAST_ACTIVE, MAX(DEAL_STATUS) AS STATUS
        FROM DGSTREAM.VW_DEAL_ORDER_SUMMARY
        WHERE PRODUCT IN ('ECM', 'DCM') AND DEAL_ID = :deal_id
        GROUP BY DEAL_ID, DEAL_NAME

  by_gfcid_template: >-
    SELECT NULL AS DEAL_ID, NULL AS DEAL_NAME, NULL AS INVESTOR_NAME,
           NULL AS GPNUM, ISSUER_NAME, GFCID,
           COUNT(DISTINCT DEAL_ID) AS DEAL_COUNT, MAX(PRICING_TS) AS LAST_ACTIVE
    FROM DGSTREAM.VW_DEAL_ORDER_SUMMARY
    WHERE PRODUCT IN ('ECM', 'DCM') AND GFCID = :gfcid
    GROUP BY ISSUER_NAME, GFCID

  field_mapping:
    - target: deal_id
      sources: [DEAL_ID]
      index: 0
    - target: deal_name
      sources: [DEAL_NAME]
      index: 0
    - target: investor_name
      sources: [INVESTOR_NAME]
      index: 0
    - target: gpnum
      sources: [GPNUM]
      index: 0
    - target: issuer_name
      sources: [ISSUER_NAME]
      index: 0
    - target: gfcid
      sources: [GFCID]
      index: 0
    - target: deal_count
      sources: [DEAL_COUNT]
      index: 0
    - target: tranche_count
      sources: [TRANCHE_COUNT]
      index: 0
    - target: last_active
      sources: [LAST_ACTIVE]
      index: 0
    - target: category
      sources: [CATEGORY]
      index: 0
    - target: region
      sources: [REGION]
      index: 0
    - target: products
      sources: [PRODUCTS]
      index: 0
    - target: sector
      sources: [SECTOR]
      index: 0
    - target: ticker
      sources: [TICKER]
      index: 0
    - target: status
      sources: [STATUS]
      index: 0

  context_mapping:
    deal_id: [deal_id, DEAL_ID]
    deal_name: [deal_name, DEAL_NAME]
    gfcid: [gfcid, GFCID]
    issuer_name: [issuer_name, ISSUER_NAME]
    gpnum: [gpnum, GPNUM]
    investor_name: [investor_name, INVESTOR_NAME]

# -- Entitlement --------------------------------------------------------
entitlement:
  enabled_env: ECM_DCM_ENTITLEMENT_FEATURE_FLAG

query_context:
  preflight_hook: src.app.text2sql.domains.ecm_dcm.components.query_context_hook:ecm_dcm_query_context_preflight

# -- Presentation -------------------------------------------------------
presentation:
  large_dataset_threshold:
    desktop: 20
    mobile: 10
  identifier_patterns:
    - ID
    - DEAL_ID
    - TRANCHE_ID
    - ORDER_ID
    - GPNUM
    - GFCID

# -- Event messages -----------------------------------------------------
event_messages:
  entity_search: Searching for deals and investors matching your query
  entitlement_check: Verifying your access entitlements
  data_connection: Establishing secure connection to deal data
  data_fetch: Fetching relevant deal and order data
  analysis: Synthesizing the analysis into a comprehensive summary
  prepare_results: Preparing results for display
  request_analysis: Understanding your question and preparing ECM/DCM insights

# -- Tool descriptions --------------------------------------------------
tool_descriptions:
  entity_search: >-
    Resolve a deal, issuer, or investor NAME only. NEVER call this for
    taxonomy words (sectors like defence/pharma, regions, currencies,
    statuses, offering types) — those are SQL filter values. Pass entity_type
    (investor_name/issuer_name/deal_name) — it decides which identifier is
    returned. Pass an explicit deal id as deal_id (NEVER as gfcid); a GFCID
    as gfcid; a GPNUM as gpnum. Explicit labeled id + name in one ask:
    resolve by the id only. A bare number attached to a deal NAME is part of
    the name — search the FULL name string. Obey the response: on
    status=ambiguous ask the user to pick; on success follow next_action to
    text2sql_query_context immediately (resolution is never a final answer);
    on no_results follow the fuzzy next_action once.
  query_generator: >-
    Generates SQL for ECM/DCM deals, tranches, investors, allocations, and
    orders against DGSTREAM.VW_DEAL_ORDER_SUMMARY. Route first: unsupported
    intents (DOMAIN_UNSUPPORTED_INTENTS_JSON) -> reply per JSON, answering
    any supported part; fast-path intents with no named entity
    (DOMAIN_FAST_PATH_INTENTS_JSON) -> no entity_search; named entities ->
    resolve once each. Generate carefully ONCE using
    DOMAIN_COLUMN_INTENT_MAP_JSON + DOMAIN_COLUMN_PRIORITY_RULES_JSON and
    the mandatory filters (PRODUCT, sargable PRICING_TS, dedupe at grain,
    GPNUM/GFCID doctrine, branch-aware broker patterns). Go straight to the executor (it validates server-side); on a validation
    error fix once and re-execute (max 2 executor attempts), stop at the
    first non-empty result. Pending blocking clarification -> no tool execution until the
    user confirms.
  data_presenter: >-
    Summarizes query results: answer-first narrative, markdown table with
    identifiers, then 2-3 data-grounded follow-up suggestions. Clarify only
    when disambiguation is mandatory. Refer to the active entity/timeframe
    naturally without restating boilerplate.
