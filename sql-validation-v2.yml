# v2 — three changes vs the reconstructed original (diff before deploying):
# 1. Dedupe rule: fixed alternation precedence so the COUNT(*) branch actually
#    fires ((?=.*A|B) matched B only at position 0), and it now also catches
#    SUM(TO_NUMBER(TRANCHE_SIZE ...)).
# 2. Narrow-anchor rule: fixed the char class so it matches the real bad
#    literal '(^|\|)' (original required two adjacent pipes and could never fire).
# 3. NEW rule: TRANCHE_SIZE is VARCHAR2 — rank/aggregate/compare requires TO_NUMBER.
rules:
  - name: "Only SELECT queries are allowed"
    type: "regex"
    value: '^\s*(with\s+.+\s+)?select\s+'
    match_should_fail: false
    error_message: "System was not able to process your request. Please try again."
    # description: "Ensures only read-only SELECT queries are executed. Supports Common Table Expressions (CTEs)."

  - name: "Prohibited data modification keywords"
    type: "regex"
    value: '\b(insert|update|delete|merge)\s+(into|from|table|set)'
    match_should_fail: true
    error_message: "System was not able to process your request. Please try again."
    # description: "Blocks DML operations. Context-aware to avoid false positives on column aliases."

  - name: "Prohibited schema modification keywords"
    type: "regex"
    value: '\b(drop|alter|create|truncate|rename)\s+(table|database|schema|view|index|column|constraint|trigger|procedure|function|user|role|sequence)'
    match_should_fail: true
    error_message: "System was not able to process your request. Please try again."
    # description: "Blocks DDL operations. Context-aware to avoid false positives on column aliases."

  - name: "No multiple queries in a single statement"
    type: "regex"
    value: ';\s*(?!\s*$).+'
    match_should_fail: true
    error_message: "System was not able to process your request. Please try again."
    # description: "Prevents query chaining attacks. Allows single trailing semicolon."

  - name: "Prevent access to sensitive system tables"
    type: "regex"
    value: '(from|join)\s+([\w\[\]]+\.)?\b(pg_\w+|information_schema|all_\w+|user_\w+|dba_\w+|v\$\w+|gv\$\w+|sys\.)\w*'
    match_should_fail: true
    error_message: "System was not able to process your request. Please try again."
    # description: "Blocks access to system tables."

  - name: "No wildcard (*) in SELECT statements"
    type: "regex"
    value: 'select\s+\*\s+(from|,)|select\s+[\w.]+\.\*\s+'
    match_should_fail: true
    error_message: "I used a wildcard selector which isn't allowed. Let me specify the exact columns needed to answer your question."
    # description: "Enforces explicit column selection. Allows aggregate functions like COUNT(*), SUM(*)."

  - name: "Prohibited dangerous functions"
    type: "regex"
    value: '\b(exec|execute|xp_cmdshell|sp_executesql|dbms_scheduler|dbms_job|dbms_xmlquery|utl_file|utl_http|utl_tcp|utl_smtp|utl_inaddr)\s*\('
    match_should_fail: true
    error_message: "I attempted to use system functions that aren't permitted. Let me reformulate this using standard SQL functions."
    # description: "Blocks functions that can execute OS commands or access files/network."

  - name: "Prevent SQL injection patterns"
    type: "regex"
    value: '(--;|;\s*--|/\*.*?\*/;|\bunion\s+(all\s+)?select|''\s*or\s*''1''\s*=\s*''1|''\s*or\s*1\s*=\s*1|''\s*or\s*''\w+''\s*=\s*''\w+'')'
    match_should_fail: true
    error_message: "I generated a query with unsafe patterns. Let me reconstruct this query using secure SQL syntax."
    # description: "Detects common SQL injection techniques."

  - name: "Prevent malicious comments"
    type: "regex"
    value: '(?:--[^\n]*;)|(?:/\*.*?\*/\s*;)'
    match_should_fail: true
    error_message: "I generated a query with problematic comment syntax. Let me rewrite this with proper formatting."
    # description: "Detects comments followed by semicolons, which could hide additional statements."

  - name: "Avoid TO_CHAR year filtering on PRICING_TS"
    type: "regex"
    value: '(?i)to_char\s*\(\s*["]?pricing_ts["]?\s*,\s*''YYYY''\s*\)\s*=\s*''\d{4}'''
    match_should_fail: true
    error_message: "Use date range predicates on PRICING_TS instead of TO_CHAR(PRICING_TS,'YYYY') for better performance and correctness (for example PRICING_TS >= DATE '2025-01-01' AND PRICING_TS < DATE '2026-01-01')."
    # description: "Blocks non-sargable year filtering on PRICING_TS."

  - name: "Avoid EXTRACT(YEAR FROM PRICING_TS) filtering"
    type: "regex"
    value: '(?i)extract\s*\(\s*year\s+from\s+pricing_ts\s*\)\s*=\s*(?:''\d{4}''|\d{4})'
    match_should_fail: true
    error_message: "Use PRICING_TS date-range predicates instead of EXTRACT(YEAR FROM PRICING_TS) for better performance (for example PRICING_TS >= DATE '2025-01-01' AND PRICING_TS < DATE '2026-01-01')."
    # description: "Blocks non-sargable year extraction filters on PRICING_TS."

  - name: "Avoid TRUNC(PRICING_TS ...) filtering"
    type: "regex"
    value: '(?i)trunc\s*\(\s*["]?pricing_ts["]?\s*(?:,\s*''(?:yyyy|yy|year|mm|month|dd|day)''\s*)?\)\s*(?:=|between|>=|<=|>|<)'
    match_should_fail: true
    error_message: "Avoid TRUNC(PRICING_TS, ...) predicates; use direct PRICING_TS range filters to preserve performance and index use."
    # description: "Blocks function-wrapped PRICING_TS predicates that degrade query performance."

  - name: "Prevent deal-level aggregate on flattened rows without dedupe"
    type: "regex"
    value: '(?is)(?=.*\bfrom\s+["]?dgstream["]?\.["]?vw_deal_order_summary["]?)(?=.*(?:\bsum\s*\(\s*(?:to_number\s*\(\s*)?tranche_size\b|\bcount\s*\(\s*\*\s*\)))(?=.*\b(select|group\s+by)\b[^;]*\b(deal_name|issuer_name)\b)(?!.*\bselect\s+distinct\b[^;]*\bdeal_id\b)(?!.*\bgroup\s+by\b[^;]*\bdeal_id\b).+'
    match_should_fail: true
    error_message: "This query appears to aggregate deal-level metrics directly from flattened rows. Deduplicate by DEAL_ID first (CTE/subquery), then compute COUNT/SUM/AVG."
    # description: "Catches common duplicate-inflation patterns for deal-level IPO summaries."

  - name: "Prevent duplicate-prone IPO listing without deal dedupe"
    type: "regex"
    value: '(?is)(?=.*\bfrom\s+["]?dgstream["]?\.["]?vw_deal_order_summary["]?)(?=.*\boffering_type["]?\s*=\s*''ipo'')(?=.*\bselect\b[^;]*\b(deal_name|issuer_name|tranche_size|pricing_ts)\b)(?!.*\bselect\s+distinct\b)(?!.*\bgroup\s+by\b[^;]*\bdeal_id\b).+'
    match_should_fail: true
    error_message: "This IPO listing query can return duplicate rows from the flattened view. Deduplicate by DEAL_ID first (CTE/subquery or DISTINCT on business grain) before final listing."
    # description: "Blocks non-deduped IPO list queries that are likely to inflate row output."

  - name: "Prevent duplicate-prone ECM/DCM deal listing without dedupe"
    type: "regex"
    value: '(?is)(?=.*\bfrom\s+["]?dgstream["]?\.["]?vw_deal_order_summary["]?)(?=.*\bselect\b[^;]*\b(deal_name|issuer_name)\b)(?=.*\bselect\b[^;]*\b(tranche_size|pricing_ts)\b)(?=.*\bproduct["]?\s*=\s*''(?:ecm|dcm)'')(?!.*\bselect\s+distinct\b)(?!.*\bgroup\s+by\b[^;]*\bdeal_id\b).+'
    match_should_fail: true
    error_message: "This deal listing query can return duplicate rows from the flattened view. Deduplicate at the intended business grain first (DEAL_ID for deal-level, DEAL_ID+TRANCHE_ID for tranche-level) before final listing."
    # description: "Blocks non-deduped ECM/DCM deal list queries that read flattened rows directly."

  - name: "Prevent investor-name filter with GFCID and no GPNUM"
    type: "regex"
    value: '(?is)(?=.*\bfrom\s+["]?dgstream["]?\.["]?vw_deal_order_summary["]?)(?=.*\binvestor_name\b["]?\s*\)?\s*(?:like|=|in\s*\())(?=.*\bgfcid\b["]?\s*\)?\s*(?:=|in\s*\())(?!.*\bgpnum\b["]?\s*\)?\s*(?:=|in\s*\()).+'
    match_should_fail: true
    error_message: "Query filters by INVESTOR_NAME and GFCID but does not use GPNUM. Investor filters must use GPNUM. Use entity search to resolve investor name, disambiguate GPNUM(s), then filter with WHERE GPNUM IN (...)."
    # description: "Blocks explicit investor/issuer identifier mix-up where investor intent is filtered by GFCID."

  - name: "Prevent investor-side aggregate with GFCID and no GPNUM"
    type: "regex"
    value: '(?is)(?=.*\bfrom\s+["]?dgstream["]?\.["]?vw_deal_order_summary["]?)(?=.*\b(?:sum|count|avg|min|max)\s*\(\s*(?:\w+\.)?(?:allocation|amt|order_id)\s*\))(?=.*\bgfcid\b["]?\s*\)?\s*(?:=|in\s*\())(?!.*\bgpnum\b["]?\s*\)?\s*(?:=|in\s*\())(?!.*\bgroup\s+by\b[^;]*\b(?:gpnum|investor_name|investor_region|investor_category)\b).+'
    match_should_fail: true
    error_message: "Query aggregates investor-side metrics (for example SUM(ALLOCATION), SUM(AMT), COUNT(ORDER_ID)) while filtering by GFCID and no GPNUM. Use GPNUM for investor-side entity filtering."
    # description: "Blocks implicit investor/issuer identifier mix-up for investor-scoped aggregates."

  - name: "B&D filter requires broker/member context"
    type: "regex"
    value: '(?is)(?=.*\bfrom\s+["]?dgstream["]?\.["]?vw_deal_order_summary["]?)(?=.*\bbnd_broker\b)(?!.*\b(?:broker_code|syndicate_member_name|syndicate_role)\b).+'
    match_should_fail: true
    error_message: "I could not build a valid broker query. B&D filtering must include broker/member context (BROKER_CODE or SYNDICATE_MEMBER_NAME, and role when relevant)."
    # description: "Prevents B&D-only SQL that ignores broker/member columns and returns noisy results."

  - name: "Prevent naive whole-field BND_BROKER equality"
    type: "regex"
    value: '(?is)\bbnd_broker\s*=\s*''(?:true|t|yes|y|1|false|f|no|n|0)'''
    match_should_fail: true
    error_message: "BND_BROKER is a pipe-delimited aligned list; do not compare the whole field with '='. Use token-aware matching (for example REGEXP_LIKE with pipe boundaries) aligned with broker/member indexes."
    # description: "Blocks incorrect whole-string comparisons on BND_BROKER for broker/B&D intents."

  - name: "Broker/member query should not rely only on issuer/investor IDs"
    type: "regex"
    value: '(?is)(?=.*\bfrom\s+["]?dgstream["]?\.["]?vw_deal_order_summary["]?)(?=.*\b(?:broker|syndicate)\b)(?=.*\b(?:gfcid|gpnum)\b)(?!.*\b(?:broker_code|syndicate_member_name|syndicate_role|bnd_broker)\b).+'
    match_should_fail: true
    error_message: "This looks like a broker/syndicate request but the SQL only filters issuer/investor identifiers. Include broker/syndicate columns (BROKER_CODE, SYNDICATE_MEMBER_NAME, SYNDICATE_ROLE, BND_BROKER)."
    # description: "Catches broker-oriented SQL plans that accidentally use issuer/investor filters only."

  - name: "Prevent brittle exact SYNDICATE_MEMBER_NAME equals Citi"
    type: "regex"
    value: '(?is)(?=.*\bfrom\s+["]?dgstream["]?\.["]?vw_deal_order_summary["]?)(?=.*\bsyndicate_member_name\s*=\s*''citi'').+'
    match_should_fail: true
    error_message: "Use token-aware pipe matching for Citi broker intent (for example REGEXP_LIKE on BROKER_CODE/SYNDICATE_MEMBER_NAME with pipe boundaries) instead of exact SYNDICATE_MEMBER_NAME = 'Citi'."
    # description: "Blocks exact-equality matching that misses valid Citi variants in pipe-delimited syndicate fields."

  - name: "Prevent legacy solo logic using distinct syndicate-member count"
    type: "regex"
    value: '(?is)(?=.*\bfrom\s+["]?dgstream["]?\.["]?vw_deal_order_summary["]?)(?=.*\bhaving\s+count\s*\(\s*distinct\s+syndicate_member_name\s*\)\s*=\s*1\b)(?=.*\b(?:max\s*\(\s*syndicate_member_name\s*\)\s*=\s*''citi''|syndicate_member_name\s*=\s*''citi'')).+'
    match_should_fail: true
    error_message: "For Citi solo intent, do not infer solo via DISTINCT SYNDICATE_MEMBER_NAME count. Use broker-token solo logic (for example Citi token match on BROKER_CODE and REGEXP_COUNT(BROKER_CODE, '\\|') = 0) with PRICING_TS range filters."
    # description: "Blocks legacy solo-detection SQL that is brittle for pipe-delimited syndicate member values and misses broker-code semantics."

  - name: "Prevent DCM solo inference using BROKER_CODE token count"
    type: "regex"
    value: '(?is)(?=.*\bfrom\s+["]?dgstream["]?\.["]?vw_deal_order_summary["]?)(?=.*\bproduct["]?\s*=\s*''dcm'')(?=.*\bregexp_count\s*\(\s*nvl\s*\(\s*broker_code\s*,\s*''''\s*\)\s*,\s*''\\|''\s*\)\s*=\s*0\b).+'
    match_should_fail: true
    error_message: "DCM rows do not carry BROKER_CODE tokens in this view, so solo cannot be inferred from REGEXP_COUNT(BROKER_CODE,'|'). Use ECM-only solo logic, or ask for DCM B&D/non-B&D using SYNDICATE_MEMBER_NAME + BND_BROKER."
    # description: "Blocks invalid DCM solo inference using BROKER_CODE token-count predicates."

  - name: "Prevent non-ECM scope for BROKER_CODE solo inference"
    type: "regex"
    value: '(?is)(?=.*\bfrom\s+["]?dgstream["]?\.["]?vw_deal_order_summary["]?)(?=.*\b(?:product\s*in\s*\(\s*''ecm''\s*,\s*''dcm''\s*\)|product\s*in\s*\(\s*''dcm''\s*,\s*''ecm''\s*\)))(?=.*\bregexp_count\s*\(\s*nvl\s*\(\s*broker_code\s*,\s*''''\s*\)\s*,\s*''\\|''\s*\)\s*=\s*0\b).+'
    match_should_fail: true
    error_message: "BROKER_CODE token-count solo logic is ECM-only. If you use REGEXP_COUNT(BROKER_CODE,'|') = 0 for solo intent, scope PRODUCT = 'ECM' (not PRODUCT IN ('ECM','DCM'))."
    # description: "Enforces ECM-only scope for solo inference patterns that rely on BROKER_CODE token count."

  - name: "Prevent narrow pipe-boundary anchor on ECM broker columns"
    type: "regex"
    value: '(?is)(?=.*\bfrom\s+["]?dgstream["]?\.["]?vw_deal_order_summary["]?)(?=.*\bregexp_like\s*\(\s*nvl\s*\(\s*(?:broker_code|syndicate_member_name|syndicate_role|bnd_broker)\s*,[^)]*\)\s*,\s*''[(][\^][|][^ ]).+'
    match_should_fail: true
    error_message: "ECM pipe delimiter is ' | ' (space-pipe-space). The pattern '(^|\\|)' only matches the first token and silently misses Citi at position 2+. Use '(^| \\| )' as the leading anchor instead."
    # description: "Blocks the old narrow '(^|\\|)' pipe-boundary anchor in REGEXP_LIKE on ECM broker/syndicate columns; the correct ECM anchor is '(^| \\| )'."

  - name: "Prevent timeout-prone CONNECT BY token expansion on broker columns"
    type: "regex"
    value: '(?is)(?=.*\bfrom\s+["]?dgstream["]?\.["]?vw_deal_order_summary["]?)(?=.*\bconnect\s+by\s+level\b)(?=.*\bregexp_substr\s*\(\s*(?:broker_code|bnd_broker|syndicate_role|syndicate_member_name)\b).+'
    match_should_fail: true
    error_message: "This query pattern can timeout on large windows. Avoid CONNECT BY LEVEL expansion for broker tokenization; use REGEXP_LIKE pipe-boundary matching on BROKER_CODE/SYNDICATE_MEMBER_NAME/BND_BROKER/SYNDICATE_ROLE instead."
    # description: "Blocks row-exploding CONNECT BY token expansion for broker/syndicate filters on VW_DEAL_ORDER_SUMMARY."

  - name: "Require row cap for broad ordered deal/tranche listings"
    type: "regex"
    value: '(?is)(?=.*\bfrom\s+["]?dgstream["]?\.["]?vw_deal_order_summary["]?)(?=.*\border\s+by\s+pricing_ts\s+desc\b)(?=.*\bselect\b[^;]*\b(deal_id|deal_name|tranche_id|tranche_name)\b)(?!.*\b(fetch\s+(?:first|next)\s+\d+\s+rows\s+only|rownum\s*(?:<=|<)\s*\d+)\b)(?!.*\b(sum|count|avg|min|max)\b).+'
    match_should_fail: true
    error_message: "For broad ordered deal/tranche listings, include a row cap (FETCH FIRST n ROWS ONLY, OFFSET n ROWS FETCH NEXT n ROWS ONLY, or ROWNUM <= n) to avoid slow queries and timeouts."
    # description: "Prevents uncapped broad listing queries that can scan/sort large ranges and timeout."

  - name: "TRANCHE_SIZE requires TO_NUMBER (stored as VARCHAR2)"
    type: "regex"
    value: '(?is)(?=.*\bfrom\s+["]?dgstream["]?\.["]?vw_deal_order_summary["]?)(?=.*(?:\b(?:sum|avg|min|max)\s*\(\s*tranche_size\b|\border\s+by\s+tranche_size\b|\btranche_size\s*(?:>=|<=|>|<)\s*\d)).+'
    match_should_fail: true
    error_message: "TRANCHE_SIZE is stored as text (VARCHAR2). Wrap it as TO_NUMBER(TRANCHE_SIZE DEFAULT NULL ON CONVERSION ERROR) before ranking, aggregating, or numeric comparison — otherwise sorting is alphabetical and SUM can fail."
    # description: "Blocks direct numeric use of the VARCHAR2 TRANCHE_SIZE column (lexicographic ORDER BY, ORA-01722 risk)."

  - name: "Monetary aggregate requires currency scoping"
    type: "regex"
    value: '(?is)(?=.*\bfrom\s+["]?dgstream["]?\.["]?vw_deal_order_summary["]?)(?=.*''\s*dcm\s*'')(?=.*\b(?:sum|avg)\s*\(\s*(?:to_number\s*\(\s*)?(?:deal_size|tranche_size|amt|demand_qty|allocation)\b)(?!.*\bcurrency\s*(?:=|\bin\b))(?!.*\bgroup\s+by\b[^;]*\bcurrency\b).+'
    match_should_fail: true
    error_message: "This sum includes DCM rows, where sizes/amounts are MONEY - and totalling money across mixed currencies is meaningless (no FX in this view). Filter one currency (WHERE CURRENCY = 'USD') or add CURRENCY to the GROUP BY. (ECM-only share sums need no currency scope.)"
    # description: "Blocks SUM/AVG of DEAL_SIZE/TRANCHE_SIZE/AMT without a CURRENCY filter or GROUP BY CURRENCY."

  - name: "AMT is the DCM metric — use ALLOCATION for ECM"
    type: "regex"
    value: '(?is)(?=.*\bfrom\s+["]?dgstream["]?\.["]?vw_deal_order_summary["]?)(?=.*\b(?:sum|avg)\s*\(\s*amt\s*\))(?=.*\bproduct["]?\s*=\s*''ecm'').+'
    match_should_fail: true
    error_message: "AMT is the DCM investor-side money metric and is empty on ECM rows. For an ECM investor amount ('how much did X invest/order/get'), use SUM(ALLOCATION), not SUM(AMT)."
    # description: "Blocks SUM/AVG(AMT) on ECM-scoped queries where ALLOCATION is the correct metric."

  - name: "Quantity metrics must not be aggregated across both products"
    type: "regex"
    value: '(?is)(?=.*\bfrom\s+["]?dgstream["]?\.["]?vw_deal_order_summary["]?)(?=.*\b(?:sum|avg)\s*\(\s*(?:to_number\s*\(\s*)?(?:allocation|deal_size|tranche_size|demand_qty)\b)(?=.*\bproduct\s+in\s*\(\s*''(?:ecm|dcm)''\s*,\s*''(?:ecm|dcm)''\s*\))(?!.*\bgroup\s+by\b[^;]*\bproduct\b).+'
    match_should_fail: true
    error_message: "DEAL_SIZE/TRANCHE_SIZE/ALLOCATION/DEMAND_QTY are SHARE counts on ECM but MONEY on DCM - aggregating across both products mixes shares with cash. Add PRODUCT to the GROUP BY, or scope one product (ECM money asks use ALLOCATION shares; DCM money uses AMT)."
    # description: "Blocks unit-mixing when ALLOCATION is aggregated across ECM and DCM together."

  - name: "Ratio must guard against divide-by-zero"
    type: "regex"
    value: '(?is)(?=.*\bfrom\s+["]?dgstream["]?\.["]?vw_deal_order_summary["]?)(?=.*/\s*(?:sum\s*\(|count\s*\(|to_number\s*\(|\b(?:demand_qty|tranche_size|allocation|deal_size)\b))(?!.*\bnullif\s*\().+'
    match_should_fail: true
    error_message: "Wrap the divisor in NULLIF(<divisor>, 0) — TRANCHE_SIZE/DEMAND_QTY can be zero or non-numeric and will raise a divide-by-zero. Example: SUM(DEMAND_QTY) / NULLIF(TO_NUMBER(TRANCHE_SIZE DEFAULT NULL ON CONVERSION ERROR), 0)."
    # description: "Requires NULLIF on the divisor for coverage/fill-rate/share ratios."

  - name: "No self-join of the flattened view"
    type: "regex"
    value: '(?is)(?=.*\bfrom\s+["]?dgstream["]?\.["]?vw_deal_order_summary["]?)(?=.*\bjoin\s+dgstream\.vw_deal_order_summary\b).+'
    match_should_fail: true
    error_message: "Do not self-join VW_DEAL_ORDER_SUMMARY — deal, tranche, order and investor facts are already on every row. Use GROUP BY with HAVING instead (e.g. investors in both deals: GROUP BY GPNUM HAVING COUNT(DISTINCT DEAL_ID) = 2)."
    # description: "Blocks expensive self-joins on the flattened view."

  - name: "LIMIT/MARKET/SCALED are IOI_TYPE values, not ORDER_TYPE"
    type: "regex"
    value: '(?is)(?=.*\bfrom\s+["]?dgstream["]?\.["]?vw_deal_order_summary["]?)(?=.*\border_type\b\s*\)?\s*(?:=|like|in)[^;]{0,30}(?:limit|market|scaled)).+'
    match_should_fail: true
    error_message: "LIMIT, MARKET and SCALED are indication (IOI) types, not order-handling types - filter IOI_TYPE for them (e.g. UPPER(IOI_TYPE) LIKE '%LIMIT%'). ORDER_TYPE holds handling values like OTT, AWAY, REGULAR."
    # description: Routes indication-type filters to the new IOI_TYPE column after the schema change.

  - name: "PRODUCT only holds ECM or DCM"
    type: "regex"
    value: '(?is)(?=.*\bfrom\s+["]?dgstream["]?\.["]?vw_deal_order_summary["]?)(?=.*\bproduct["]?\s*=\s*''(?!\s*(?:ecm|dcm)\s*'')[^'']*'').+'
    match_should_fail: true
    error_message: "PRODUCT only ever holds 'ECM' or 'DCM' (which market). A security type like ADR/GDR/Common Stock belongs in PRODUCT_TYPE; a bond class like Investment Grade/High Yield belongs in PRODUCT_CLASS. Rewrite using the correct column."
    description: "Catches PRODUCT filtered with a non-market value (wrong-column confusion with PRODUCT_TYPE/PRODUCT_CLASS)."

  - name: "Inline (true) member-suffix matching is DEPRECATED - use the BND_BROKER index"
    type: "regex"
    value: '(?is)(?:\\\(|\()\s*true\s*(?:\\\)|\))'
    match_should_fail: true
    error_message: "The inline (true)/(false) suffixes inside SYNDICATE_MEMBER_NAME are duplicate data being REMOVED - filters on them will silently return zero rows. Use the position-aligned BND_BROKER list instead: the B&D bank = the member token at the 'true' index - INSTR(BND_BROKER,'true') > 0 AND UPPER(TRIM(REGEXP_SUBSTR(SYNDICATE_MEMBER_NAME,'[^|]+',1, REGEXP_COUNT(SUBSTR(BND_BROKER,1,INSTR(BND_BROKER,'true')),'\\|')+1))) LIKE '%<BANK>%'. INSTR = 0 means no B&D designated on that row."
    description: "Deprecates inline-suffix B&D matching in favor of the BND_BROKER positional index."
  - name: "EXCHANGE filters use UPPER LIKE - never equality"
    type: "regex"
    value: '(?is)\bexchange["]?\s*=\s*''[^'']*'''
    match_should_fail: true
    error_message: "Exact '=' on EXCHANGE returns zero rows (stored values are venue names, possibly multiple). Users say abbreviations - expand them and OR both tokens: (UPPER(EXCHANGE) LIKE '%NYSE%' OR UPPER(EXCHANGE) LIKE '%NEW YORK%'), TSX->TORONTO, LSE->LONDON, HKEX->HONG KONG."
    description: "Catches equality or NYSE-ticker filters on EXCHANGE (a full-name, possibly multi-valued column)."

  - name: "DCM-only columns filtered in an ECM-scoped query"
    type: "regex"
    value: '(?is)(?=.*\b(?:tranche_status|coupon_type|coupon_freq|tenors|seniority|esg_bond)["]?\s*\)?\s*(?:>=|<=|<>|!=|=|>|<|like|in\s*\(|is\s+not\s+null))(?=.*\bproduct["]?\s*=\s*''\s*ecm\s*'')(?!.*''\s*dcm\s*'').+'
    match_should_fail: true
    error_message: "That column is a DCM/bond concept (TRANCHE_STATUS confirmed NULL on ECM; coupon/tenor/seniority/ESG are bond-side) - an ECM-scoped filter on it returns zero rows. Scope the query to DCM, or use the ECM equivalents (status -> DEAL_STATUS; type -> EQUITY_TYPE/PRODUCT_TYPE)."
    description: "Catches an ECM-only-scoped query filtering TRANCHE_STATUS (always-NULL column for ECM)."

  - name: "Never double-quote the view name as one identifier"
    type: "regex"
    value: '(?is)from\s+"dgstream\.vw_deal_order_summary"'
    match_should_fail: true
    error_message: "Oracle treats \"DGSTREAM.VW_DEAL_ORDER_SUMMARY\" in double quotes as ONE identifier containing a dot - the table will not resolve (ORA-00942). Remove ALL double quotes and write: FROM DGSTREAM.VW_DEAL_ORDER_SUMMARY. Style rule: never double-quote any table or column identifier - bare UPPERCASE names only."
    description: "Catches the quote-wrapped dotted view name (invalid single identifier)."

  - name: "Timestamp compares need the DATE keyword, not a bare string"
    type: "regex"
    value: '(?is)["]?(?:pricing_ts|settlement_ts)["]?\s*(?:>=|<=|<>|!=|=|<|>)\s*''\d{4}-\d{2}-\d{2}'''
    match_should_fail: true
    error_message: "Comparing PRICING_TS/SETTLEMENT_TS to a bare string like 2026-01-01 relies on session NLS format and fails or misfilters. Always use the DATE keyword: PRICING_TS >= DATE 2026-01-01 AND PRICING_TS < DATE 2027-01-01."
    description: "Catches timestamp-vs-bare-string comparisons missing the DATE literal keyword."

  - name: "COUNT of an id column needs DISTINCT (flattened view duplicates rows)"
    type: "regex"
    value: '(?is)\bcount\s*\(\s*(?:\w+\.)?(?:order_id|deal_id|tranche_id|gpnum|investor_name)\s*\)'
    match_should_fail: true
    error_message: "This view is FLATTENED - the same order/deal/investor appears on multiple rows, so COUNT(ORDER_ID) (or DEAL_ID/GPNUM/INVESTOR_NAME) over-counts and SUM over raw rows inflates. Use COUNT(DISTINCT <col>), and aggregate over a deduped subquery: SELECT ... FROM (SELECT DISTINCT <grain cols> FROM ... WHERE ...) GROUP BY ..."
    description: "Catches COUNT of an identity column without DISTINCT on the flattened view."

  - name: "EQUITY_TYPE and PRODUCT_TYPE are different axes - never OR them"
    type: "regex"
    value: '(?is)(?=.*\bequity_type\b)(?=.*\bproduct_type\b)(?=.*\bor\s*\(?\s*(?:upper\s*\(\s*)?(?:equity_type|product_type)\b).+'
    match_should_fail: true
    error_message: "EQUITY_TYPE (classification: Common Stock, Convertible Bonds/Preferred, Warrants, Equity Units, Exchangable Notes, American/Global Depository) and PRODUCT_TYPE (labels: ADR/ADS/GDR/GDS, 144A, Class A, Rights, Conv. Bond/Pfd...) must not be OR-combined - pick the ONE axis the user's wording names. Same-column alternatives use IN (...), not OR chains."
    description: "Rejects hedged OR filters across the two security-type taxonomy columns."

  - name: "ECM-only columns filtered in a DCM-scoped query"
    type: "regex"
    value: '(?is)(?=.*\b(?:equity_type|product_type)[\"]?\s*\)?\s*(?:>=|<=|<>|!=|=|>|<|like|in\s*\(|is\s+not\s+null))(?=.*\bproduct[\"]?\s*=\s*''\s*dcm\s*'')(?!.*''\s*ecm\s*'').+'
    match_should_fail: true
    error_message: "EQUITY_TYPE and PRODUCT_TYPE are ECM-only (confirmed: DCM rows do not carry equity/product type) - a DCM-scoped filter on them returns zero rows. Security-type asks imply PRODUCT = 'ECM'; DCM instrument types live in PRODUCT_CLASS/COUPON_TYPE/ESG_BOND."
    description: "Catches a DCM-only-scoped query filtering the ECM-only security-type columns."

  - name: "Identifier columns need LIKE - never equality (pipe-delimited lists)"
    type: "regex"
    value: '(?is)\bidentifier_(?:value|type)[\"]?\s*\)?\s*=\s*''[^'']*'''
    match_should_fail: true
    error_message: "IDENTIFIER_TYPE/IDENTIFIER_VALUE hold PIPE-DELIMITED lists on many rows ('CUSIP | FIGI | ISIN...') - equality only matches single-identifier rows and silently misses the rest. Use case-insensitive LIKE (DCM stores ALL identifier types lowercase, ECM all caps): UPPER(IDENTIFIER_TYPE) LIKE '%CUSIP%' AND UPPER(IDENTIFIER_VALUE) LIKE '%<id>%'."
    description: "Catches equality comparisons on the pipe-delimited identifier columns."

  - name: "Fabricated columns - CUSIP/ISIN/EXEC_DATE/PRICE/COUPON do not exist"
    type: "regex"
    value: '(?is)(?<!as )\b(?:cusip|isin|exec_date|execution_date|announce_date|announced_date|issue_date|maturity_date|offer_price|price|coupon|order_status)\b\s*(?:=|!=|<>|>=|<=|like\b|,|\s+from\b|\s+desc\b|\s+asc\b)'
    match_should_fail: true
    error_message: "That column does not exist in this view. Identifiers: IDENTIFIER_TYPE LIKE '%CUSIP%' AND IDENTIFIER_VALUE LIKE '%<id>%' (never a CUSIP/ISIN column). Event dates: PRICING_TS / SETTLEMENT_TS only (no EXEC_DATE/ISSUE_DATE/MATURITY_DATE). Coupon: COUPON_TYPE / COUPON_FREQ (no bare COUPON or PRICE column). Order status does not exist - deal lifecycle lives in DEAL_STATUS. Use ONLY columns from query_context schema_context - if query_context was not called this conversation, call it FIRST and rebuild."
    description: "Backstop against schema hallucination when the model skipped query_context (finance-plausible invented columns)."

  - name: "NOT LIKE on a pipe-list syndicate column excludes the whole syndicate"
    type: "regex"
    value: '(?is)(?=.*''\s*ecm\s*'')(?=.*(?:\b(?:syndicate_member_name|broker_code)[\"]?\s*\)?\s*not\s+like\b|\bnot\s*\(\s*(?:upper\s*\(\s*)?[\"]?(?:syndicate_member_name|broker_code)\b.{0,40}?\blike\b)).+'
    match_should_fail: true
    error_message: "On ECM rows SYNDICATE_MEMBER_NAME/BROKER_CODE are PIPE LISTS of the whole syndicate - NOT LIKE excludes every deal where that bank appears ANYWHERE (structural zero rows). Extract the single B&D token by INDEX first, then negate THAT: INSTR(BND_BROKER,'true') > 0 AND UPPER(TRIM(REGEXP_SUBSTR(SYNDICATE_MEMBER_NAME,'[^|]+',1, REGEXP_COUNT(SUBSTR(BND_BROKER,1,INSTR(BND_BROKER,'true')),'\\|')+1))) NOT LIKE '%CITI%'. Plain NOT LIKE is valid only in DCM-only scope (single-value column)."
    description: "Catches whole-list negation on pipe-delimited syndicate columns in ECM-involving queries."

  - name: "Negation phrases are predicates, not stored values"
    type: "regex"
    value: '(?is)\b(?:investor_region|tranche_region|deal_region|investor_category|meeting_type|sector|currency)[\"]?\s*\)?\s*(?:=|like)\s*''%?\s*(?:non|not)[\s_-]'
    match_should_fail: true
    error_message: "'Non X' / 'Not X' is the USER'S negation, not a stored value - no column holds literals like 'Non USA'. Rewrite as a negation predicate: UPPER(INVESTOR_REGION) NOT LIKE '%UNITED STATES%' (etc). NOT-predicates exclude NULL rows - report the excluded no-value count in the answer (unknown is not non-X)."
    description: "Catches user negation phrases pasted into equality/LIKE literals."

  - name: "Id columns are TEXT - quote the literal"
    type: "regex"
    value: '(?is)\b(?:deal_id|tranche_id|order_id|parent_id|root_id|gpnum|gfcid)[\"]?\s*(?:=|!=|<>|in\s*\()\s*\d'
    match_should_fail: true
    error_message: "DEAL_ID/TRANCHE_ID/ORDER_ID/GPNUM/GFCID are TEXT columns - an unquoted numeric literal forces TO_NUMBER over every row, and DCM ids contain letters ('I-241121-...') so the query dies with ORA-01722. Quote the id: DEAL_ID = '25248935'. (Unquoted GPNUM also silently drops leading zeros.)"
    description: "Catches unquoted numeric comparisons on text id columns (ORA-01722 class)."

  - name: "Identifier LIKEs need UPPER - casing differs per product"
    type: "regex"
    value: '(?is)(?<!upper\()\bidentifier_(?:type|value)[\"]?\s+like\b'
    match_should_fail: true
    error_message: "IDENTIFIER_TYPE/VALUE casing differs per product (DCM stores ALL identifier types lowercase - 'cusip','isin','figi' - ECM all caps) - a case-sensitive LIKE silently misses one product. Wrap BOTH sides: UPPER(IDENTIFIER_TYPE) LIKE '%CUSIP%' AND UPPER(IDENTIFIER_VALUE) LIKE '%<id>%'."
    description: "Catches case-sensitive LIKE on the mixed-case identifier columns."

  - name: "To-now windows need the tomorrow-midnight upper bound"
    type: "regex"
    value: '(?is)(?=.*\bpricing_ts[\"]?\s*>=\s*(?:add_months\s*\(\s*sysdate|trunc\s*\(\s*sysdate|sysdate\s*-))(?!.*\bpricing_ts[\"]?\s*<).+'
    match_should_fail: true
    error_message: "A trailing window (>= ADD_MONTHS/TRUNC(SYSDATE)-N) with NO upper bound admits FUTURE-dated rows - this data carries future PRICING_TS (test deals dated 2027/2028), and a 2028 pricing is not 'the last 12 months'. Add: AND PRICING_TS < TRUNC(SYSDATE) + 1 (keeps all of today, excludes the future)."
    description: "Catches unbounded trailing windows that let future-dated pricings into last-N periods."

  # -- PRODUCT-filter defense-in-depth ----------------------------------
  # Primary access control is the upstream entitlement gate that
  # short-circuits requests for users with no entitled products.
  # Per-query PRODUCT scoping is the LLM's responsibility via the
  # runtime "Access Scope" instruction injected into the system prompt.
  #
  # This rule is a secondary safety net (defense-in-depth) that catches
  # the edge case where the LLM omits the PRODUCT clause despite prompt
  # instructions. The error_message is deliberately generic to avoid
  # leaking internal table names or schema details to end users.
  # It handles both single-product (= 'ECM') and dual-product
  # (IN ('ECM', 'DCM')) scoping patterns.
  - name: "Product scope required for VW_DEAL_ORDER_SUMMARY"
    type: "regex"
    value: '(?is)(?=.*\bfrom\s+["]?dgstream["]?\.["]?vw_deal_order_summary["]?).*\bproduct["]?\s*(?:=\s*''(?:ECM|DCM)''|in\s*\(\s*''(?:ECM|DCM)'')'
    match_should_fail: false
    error_message: "Every query must SELECT FROM DGSTREAM.VW_DEAL_ORDER_SUMMARY (the only table in this domain) and include an explicit PRODUCT filter (PRODUCT = 'ECM' / 'DCM' / IN ('ECM','DCM')). If you used any other table name, you invented it — rebuild the query against DGSTREAM.VW_DEAL_ORDER_SUMMARY using only columns from schema_context."
    # description: "Defense-in-depth safety net: every query against VW_DEAL_ORDER_SUMMARY must include an explicit PRODUCT filter (PRODUCT = 'ECM'/'DCM' or PRODUCT IN ('ECM','DCM')). Primary access control is the upstream entitlement gate; this rule is the secondary check."